d var(--line); padding-bottom: env(safe-area-inset-bottom);\n}\n.nav-in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }\n.nav-in button {\n  padding: 10px 0 11px; display: flex; flex-direction: column; align-items: center; gap: 3px;\n  color: var(--dim); font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;\n}\n.nav-in button.on { color: var(--lime); }\n.nav-in svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n.fab {\n  position: fixed; right: calc(50% - 300px + 16px); bottom: calc(76px + env(safe-area-inset-bottom));\n  z-index: 75; width: 56px; height: 56px; border-radius: 19px;\n  background: linear-gradient(135deg, var(--lime), var(--lime-dark)); color: #060a12;\n  display: grid; place-items: center; box-shadow: 0 12px 30px rgba(0,0,0,.45);\n  transition: transform .15s ease;\n}\n[data-theme=\"light\"] .fab { color: #ffffff; }\n.fab:active { transform: scale(0.92); }\n@media(max-width: 632px) { .fab { right: 16px; } }\n\n/* QR Scanner Image & UPI Box */\n.upi-card {\n  background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 12px;\n  display: flex; flex-direction: column; gap: 10px; margin-top: 10px;\n}\n.qr-preview {\n  width: 140px; height: 140px; border-radius: 12px; border: 2px dashed var(--line2);\n  display: grid; place-items: center; overflow: hidden; margin: 0 auto; background: #ffffff;\n}\n.qr-preview img { width: 100%; height: 100%; object-fit: contain; }\n\n/* empty + toast */\n.empty { text-align: center; padding: 36px 20px; border: 1px dashed var(--line2); border-radius: 20px; }\n.empty .em { font-size: 34px; margin-bottom: 8px; }\n.empty h3 { margin: 6px 0 4px; font-size: 16px; font-weight: 800; color: var(--text-heading); }\n.empty p { margin: 0 0 16px; font-size: 12px; color: var(--muted); line-height: 1.6; }\n\n#toast {\n  position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 300;\n  background: var(--surface); color: var(--text-heading); border: 1px solid var(--line2);\n  padding: 10px 18px; border-radius: 99px; font-size: 12px; font-weight: 700;\n  box-shadow: 0 10px 30px rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;\n}\n#toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }\nhr.sep { border: none; border-top: 1px solid var(--line); margin: 14px 0; }\n</style>\n<style id=\"rise-skin\">\n    :root, [data-theme=\"light\"], [data-theme=\"dark\"] {\n      --bg:#eef1f6; --surface:#ffffff; --card:#ffffff; --card2:#f1f4f9; --card3:#e2e8f0;\n      --line:#e2e8f0; --line2:#cbd5e1;\n      --lime:#65a30d; --lime-dark:#4d7c0f; --teal:#0d9488; --blue:#2563eb;\n      --purple:#7c3aed; --red:#e11d48; --gold:#ca8a04; --orange:#ea580c;\n      --text:#0f172a; --text-heading:#0f172a; --muted:#475569; --dim:#94a3b8;\n      --shadow:0 4px 20px -2px rgba(0,0,0,.06);\n      --hero-bg:linear-gradient(150deg, rgba(101,163,13,.10), rgba(13,148,136,.06));\n      --hero-border:rgba(101,163,13,.25);\n      --badge-admin:rgba(101,163,13,.12);  --badge-admin-txt:#4d7c0f;\n      --badge-op:rgba(37,99,235,.12);      --badge-op-txt:#2563eb;\n      --badge-viewer:rgba(100,116,139,.12);--badge-viewer-txt:#475569;\n    }\n    body{font-family:'Sora',system-ui,-apple-system,sans-serif;background:var(--bg)}\n  </style></head>\n<body>\n<div id=\"app\"></div>\n<div id=\"toast\"></div>\n<input type=\"file\" id=\"importer\" accept=\"application/json\" style=\"display:none\">\n<input type=\"file\" id=\"qr-file-input\" accept=\"image/*\" style=\"display:none\">\n\n<script>\n(function(){\n\"use strict\";\n\n/* ───────── constants & helpers ───────── */\nvar STORAGE_KEY = \"court-ledger-master-v3\";\nvar $ = function(s){ return document.querySelector(s); };\nvar PALETTE = [\"#10b981\",\"#06b6d4\",\"#3b82f6\",\"#f97316\",\"#8b5cf6\",\"#ec4899\",\"#eab308\",\"#f43f5e\",\"#14b8a6\",\"#6366f1\",\"#84cc16\",\"#d946ef\"];\n\nvar ROLES = {\n  primary_admin: { label: \"Primary Admin\", desc: \"Creator with full access across all features, settings & books\", icon: \"👑\" },\n  book_admin:    { label: \"Book Admin\",    desc: \"Can manage members, book settings & add/edit/delete all entries\", icon: \"⭐\" },\n  data_operator: { label: \"Data Operator\", desc: \"Can add bookings, log payments & view ledgers. Cannot delete others' logs\", icon: \"✏️\" },\n  viewer:        { label: \"Viewer\",        desc: \"Read-only access to view logs, ledgers and balances\", icon: \"👁️\" }\n};\n\nfunction esc(s){ return String(s==null?\"\":s).replace(/[&<>\"']/g,function(c){return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]||c;}); }\nfunction uid(prefix){ return (prefix||\"id\")+\"_\"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }\nfunction P(v){ return Math.round((Number(v)||0)*100); } // rupees to paise\nfunction money(p){\n  var neg = p<0; p = Math.abs(p);\n  var s = \"₹\"+(p/100).toLocaleString(\"en-IN\",{minimumFractionDigits:(p%100?2:0),maximumFractionDigits:2});\n  return (neg?\"−\":\"\")+s;\n}\nfunction initials(n){ var p=String(n||\"?\").trim().split(/\\s+/); return (p[0][0]+(p[1]?p[1][0]:\"\")).toUpperCase(); }\nfunction pad(n){ return String(n).padStart(2,\"0\"); }\nfunction nowParts(){\n  var d = new Date();\n  return {\n    date: d.getFullYear()+\"-\"+pad(d.getMonth()+1)+\"-\"+pad(d.getDate()),\n    time: pad(d.getHours())+\":\"+pad(d.getMinutes())\n  };\n}\nfunction fmtTime(tStr){\n  if(!tStr) return \"\";\n  var p = tStr.split(\":\"); if(p.length<2) return tStr;\n  var h = parseInt(p[0],10), m = p[1];\n  var ampm = h>=12 ? \"PM\" : \"AM\";\n  h = h%12; if(h===0) h=12;\n  return h+\":\"+m+\" \"+ampm;\n}\nfunction fmtDT(at, slotText){\n  if(!at) return \"\";\n  var d = new Date(at.split(\"T\")[0]);\n  var datePart = isNaN(d.getTime()) ? at : d.toLocaleDateString(\"en-IN\",{weekday:\"short\",day:\"numeric\",month:\"short\"});\n  if(slotText) return datePart + \" · \" + slotText;\n  var tPart = at.indexOf(\"T\")>=0 ? at.split(\"T\")[1].slice(0,5) : \"\";\n  return datePart + (tPart ? \" · \" + fmtTime(tPart) : \"\");\n}\nfunction fmtD(at){\n  var d = new Date((at||\"\").split(\"T\")[0]);\n  if(isNaN(d.getTime())) return at||\"\";\n  return d.toLocaleDateString(\"en-IN\",{day:\"numeric\",month:\"short\",year:\"2-digit\"});\n}\nfunction toast(msg){\n  var t = $(\"#toast\"); if(!t) return;\n  t.textContent = msg; t.classList.add(\"show\");\n  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove(\"show\"); }, 2000);\n}\n\n/* ───────── storage ───────── */\nvar Store = {\n  load: function(){\n    try {\n      var v = localStorage.getItem(STORAGE_KEY);\n      if(v) return JSON.parse(v);\n    } catch(e){}\n    return null;\n  },\n  save: function(data){\n    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}\n  }\n};\n\n/* ───────── master state ───────── */\nvar DB = {\n  theme: \"dark\",\n  activeBookId: \"b_default\",\n  globalDirectory: [], // [ { name, mobile, upiId, qrImage, color } ]\n  books: []\n};\n\nvar S = {\n  view: \"home\",       // 'home' | 'activities' | 'balances' | 'people' | 'allbooks'\n  sheet: null,        // 'activity' | 'payment' | 'person' | 'edit-profile' | 'qrview' | 'type' | 'people' | 'books' | 'create-book' | 'invite' | 'menu' | 'roles-info' | 'notifications'\n  draft: null,\n  open: {},\n  balMode: \"pairs\",   // 'pairs' | 'everyone' | 'settle'\n  qrTargetPersonId: null,\n  roleInfoTab: \"primary_admin\",\n  searchQuery: \"\"\n};\n\n/* ───────── model accessors & RBAC ───────── */\nfunction activeBook(){\n  var b = DB.books.filter(function(x){ return x.id === DB.activeBookId; })[0];\n  if(!b && DB.books.length){ DB.activeBookId = DB.books[0].id; b = DB.books[0]; }\n  return b;\n}\nfunction saveDB(){ Store.save(DB); }\nfunction applyTheme(th){ th = \"light\"; /* pinned by RISE build */\n  DB.theme = th || \"dark\";\n  document.documentElement.setAttribute(\"data-theme\", DB.theme);\n  var metaTheme = document.querySelector('meta[name=\"theme-color\"]');\n  if(metaTheme) metaTheme.setAttribute(\"content\", DB.theme===\"light\"?\"#ffffff\":\"#060a12\");\n  saveDB();\n}\n\nfunction bPerson(book, id){\n  if(!book || !book.people) return null;\n  for(var i=0;i<book.people.length;i++) if(book.people[i].id===id) return book.people[i];\n  return null;\n}\nfunction bPName(book, id){ var p=bPerson(book,id); return p?p.name:\"—\"; }\nfunction bPColor(book, id){ var p=bPerson(book,id); return p?p.color:\"#8899b4\"; }\nfunction bPRole(book, id){ var p=bPerson(book,id); return (p&&p.role) ? p.role : \"data_operator\"; }\nfunction isMeInBook(book, id){ return book && book.meId && book.meId===id; }\nfunction myRole(book){\n  if(!book || !book.meId) return \"primary_admin\";\n  var me = bPerson(book, book.meId);\n  return me ? (me.role || \"primary_admin\") : \"primary_admin\";\n}\n\n/* Permission Checks */\nfunction canAddEntries(book){\n  var r = myRole(book);\n  return r === \"primary_admin\" || r === \"book_admin\" || r === \"data_operator\";\n}\nfunction canEditEntry(book, act){\n  var r = myRole(book);\n  if(r === \"primary_admin\" || r === \"book_admin\") return true;\n  if(r === \"data_operator\" && book.meId && act && act.payerId === book.meId) return true;\n  return false;\n}\nfunction canDeleteEntry(book, act){\n  var r = myRole(book);\n  if(r === \"primary_admin\" || r === \"book_admin\") return true;\n  if(r === \"data_operator\" && book.meId && act && act.payerId === book.meId) return true;\n  return false;\n}\nfunction canManageBookSettings(book){\n  var r = myRole(book);\n  return r === \"primary_admin\" || r === \"book_admin\";\n}\nfunction canDeleteBook(book){\n  var r = myRole(book);\n  return r === \"primary_admin\";\n}\n\nfunction bTypeOf(book, id){\n  if(!book || !book.types) return {id:id,label:\"Activity\",emoji:\"🏟️\"};\n  for(var i=0;i<book.types.length;i++) if(book.types[i].id===id) return book.types[i];\n  return {id:id,label:\"Activity\",emoji:\"🏟️\"};\n}\n\n/* Sync to Global Directory */\nfunction syncPersonToDirectory(p){\n  if(!p || !p.name) return;\n  if(!DB.globalDirectory) DB.globalDirectory = [];\n  var existing = DB.globalDirectory.filter(function(x){ return x.name.toLowerCase() === p.name.toLowerCase(); })[0];\n  if(existing){\n    if(p.mobile) existing.mobile = p.mobile;\n    if(p.upiId) existing.upiId = p.upiId;\n    if(p.qrImage) existing.qrImage = p.qrImage;\n  } else {\n    DB.globalDirectory.push({\n      name: p.name,\n      mobile: p.mobile || \"\",\n      upiId: p.upiId || \"\",\n      qrImage: p.qrImage || \"\",\n      color: p.color || PALETTE[DB.globalDirectory.length % PALETTE.length]\n    });\n  }\n}\n\n/* ───────── calculation engine ───────── */\nfunction calcShares(book, act){\n  var ids = (act.parts||[]).filter(function(id){ return !!bPerson(book, id); });\n  var out = {}; var n = ids.length; if(!n) return out;\n  var total = P(act.amount), base = Math.floor(total/n), rem = total - base*n;\n  ids.forEach(function(id){ out[id] = base; });\n  if (rem > 0){\n    if (out[act.payerId] != null) out[act.payerId] += rem;\n    else { var i=0; while(rem-- > 0){ out[ids[i % n]] += 1; i++; } }\n  }\n  return out;\n}\n\nfunction calcOwedMap(book){\n  var m = {};\n  function add(a,b,v){ if(a===b||!v) return; if(!m[a]) m[a]={}; m[a][b]=(m[a][b]||0)+v; }\n  (book.activities||[]).forEach(function(act){\n    var s = calcShares(book, act);\n    Object.keys(s).forEach(function(pid){ if(pid!==act.payerId) add(pid, act.payerId, s[pid]); });\n  });\n  (book.payments||[]).forEach(function(p){\n    if(p.status===\"confirmed\") add(p.fromId, p.toId, -P(p.amount));\n  });\n  return m;\n}\n\nfunction calcNet(book, a, b){\n  var m = calcOwedMap(book);\n  return ((m[a]&&m[a][b])||0) - ((m[b]&&m[b][a])||0);\n}\n\nfunction calcBalance(book, pid){\n  var t = 0;\n  (book.people||[]).forEach(function(o){ if(o.id!==pid) t += calcNet(book, o.id, pid); });\n  return t;\n}\n\nfunction calcPairs(book){\n  var out = [];\n  var ppl = book.people || [];\n  for (var i=0; i<ppl.length; i++) {\n    for (var j=i+1; j<ppl.length; j++){\n      var a = ppl[i].id, b = ppl[j].id;\n      var n = calcNet(book, a, b);\n      var legAB=0, legBA=0;\n      (book.activities||[]).forEach(function(act){\n        var s = calcShares(book, act);\n        if(act.payerId===b && s[a]) legAB += s[a];\n        if(act.payerId===a && s[b]) legBA += s[b];\n      });\n      var paidAB=0, paidBA=0;\n      (book.payments||[]).forEach(function(p){\n        if(p.status!==\"confirmed\") return;\n        if(p.fromId===a && p.toId===b) paidAB += P(p.amount);\n        if(p.fromId===b && p.toId===a) paidBA += P(p.amount);\n      });\n      if (legAB || legBA || paidAB || paidBA) {\n        out.push({a:a, b:b, net:n, legAB:legAB, legBA:legBA, paidAB:paidAB, paidBA:paidBA});\n      }\n    }\n  }\n  return out.sort(function(x,y){ return Math.abs(y.net)-Math.abs(x.net); });\n}\n\nfunction calcSettleUp(book){\n  var cred=[], debt=[];\n  (book.people||[]).forEach(function(p){\n    var b = calcBalance(book, p.id);\n    if(b>0) cred.push({id:p.id, v:b});\n    else if(b<0) debt.push({id:p.id, v:-b});\n  });\n  cred.sort(function(a,b){return b.v-a.v;}); debt.sort(function(a,b){return b.v-a.v;});\n  var out=[], i=0, j=0;\n  while(i<debt.length && j<cred.length){\n    var v = Math.min(debt[i].v, cred[j].v);\n    if(v>0) out.push({from:debt[i].id, to:cred[j].id, v:v});\n    debt[i].v -= v; cred[j].v -= v;\n    if(debt[i].v<=0) i++; if(cred[j].v<=0) j++;\n  }\n  return out;\n}\n\nfunction calcLedgerFor(book, pid){\n  var rows = [];\n  (book.activities||[]).forEach(function(act){\n    var s = calcShares(book, act), t = bTypeOf(book, act.typeId);\n    var slotInfo = act.slotText || (act.startTime ? fmtTime(act.startTime)+(act.endTime?\"–\"+fmtTime(act.endTime):\"\") : \"\");\n    if(act.payerId===pid){\n      var lent = 0; Object.keys(s).forEach(function(k){ if(k!==pid) lent += s[k]; });\n      if (lent) rows.push({\n        at: act.date||act.at,\n        delta: lent,\n        ttl: t.emoji + \" \" + t.label + (act.venue ? \" · \" + act.venue : \"\"),\n        sub: \"You paid \" + money(P(act.amount)) + \" for \" + Object.keys(s).length + \" · covered \" + money(lent) + \" for others\" + (slotInfo ? \" (\" + slotInfo + \")\" : \"\")\n      });\n    } else if (s[pid]!=null){\n      rows.push({\n        at: act.date||act.at,\n        delta: -s[pid],\n        ttl: t.emoji + \" \" + t.label + (act.venue ? \" · \" + act.venue : \"\"),\n        sub: \"Your share of \" + money(P(act.amount)) + \" split \" + Object.keys(s).length + \" ways · booked by \" + bPName(book, act.payerId) + (slotInfo ? \" (\" + slotInfo + \")\" : \"\")\n      });\n    }\n  });\n  (book.payments||[]).forEach(function(p){\n    if (p.status!==\"confirmed\") return;\n    if (p.fromId===pid) rows.push({at:p.date||p.at, delta:P(p.amount), ttl:\"💸 Paid \"+bPName(book, p.toId), sub:(p.note||\"Settlement\")+\" (\"+(p.paymentMode||\"UPI\")+\")\", pay:true});\n    if (p.toId===pid)  rows.push({at:p.date||p.at, delta:-P(p.amount), ttl:\"✅ Received from \"+bPName(book, p.fromId), sub:(p.note||\"Settlement\")+\" (\"+(p.paymentMode||\"UPI\")+\")\", pay:true});\n  });\n  rows.sort(function(a,b){ return new Date(a.at)-new Date(b.at); });\n  var run = 0; rows.forEach(function(r){ run += r.delta; r.run = run; });\n  return rows.reverse();\n}\n\nfunction getPendingNotifications(book){\n  if(!book || !book.payments) return [];\n  return book.payments.filter(function(p){\n    return p.status === \"pending\" && (!book.meId || p.toId === book.meId);\n  });\n}\n\n/* ───────── UI helpers ───────── */\nfunction av(book, id, cls){\n  var p = bPerson(book, id); var c = p ? p.color : \"#8899b4\"; var nm = p ? p.name : \"?\";\n  return '<div class=\"av '+(cls||\"\")+'\" style=\"background:linear-gradient(135deg,'+c+','+c+'99)\">'+esc(initials(nm))+'</div>';\n}\nfunction pill(txt,color){ return '<span class=\"pill\" style=\"background:'+color+'1f;color:'+color+'\">'+txt+'</span>'; }\nfunction nameOrYou(book, id){ return isMeInBook(book, id) ? \"You\" : bPName(book, id); }\n\n/* ───────── VIEW: HOME ───────── */\nfunction viewHome(){\n  var book = activeBook();\n  if(!book || !book.people || !book.people.length) return onboarding();\n\n  var me = book.meId ? bPerson(book, book.meId) : null;\n  var h = \"\";\n\n  // Two-Party Notification Alert Banner for Recipient\n  var notifs = getPendingNotifications(book);\n  if(notifs.length){\n    h += notifs.map(function(p){\n      return '<div class=\"notif-banner\"><div style=\"font-size:22px\">🔔</div>'+\n        '<div class=\"grow\"><div style=\"font-weight:700;color:var(--gold)\">Payment Acknowledgment Requested</div>'+\n        '<div class=\"sub\" style=\"margin-top:2px\"><b>'+esc(bPName(book, p.fromId))+'</b> marked payment of <b>'+money(P(p.amount))+'</b> to you via '+(p.paymentMode||\"UPI\")+(p.note?' ('+esc(p.note)+')':'')+'</div></div>'+\n        '<button class=\"btn sm pri\" data-a=\"confirmpay\" data-id=\"'+p.id+'\">Confirm Received</button>'+\n        '<button class=\"btn sm ghost\" data-a=\"delpay\" data-id=\"'+p.id+'\">✕</button></div>';\n    }).join(\"\");\n  }\n\n  if (me){\n    var b = calcBalance(book, me.id);\n    var owedToMe = 0, iOwe = 0;\n    book.people.forEach(function(o){\n      if(o.id===me.id) return;\n      var n = calcNet(book, o.id, me.id);\n      if(n>0) owedToMe += n; else iOwe += -n;\n    });\n    h += '<section class=\"hero\">'+\n      '<div class=\"eyebrow\">'+esc(book.name)+' · Balance</div>'+\n      '<div class=\"big num\" style=\"color:'+(b>0?\"var(--lime)\":(b<0?\"var(--red)\":\"var(--text)\"))+'\">'+money(Math.abs(b))+'</div>'+\n      '<div class=\"note\">'+(b>0?\"You are owed in this book\":(b<0?\"You currently owe in this book\":\"You are all square in this book. Nice!\"))+'</div>'+\n      '<div class=\"split2\">'+\n        '<div class=\"mini\"><b class=\"num\" style=\"color:var(--teal)\">'+money(owedToMe)+'</b><span>Owed to you</span></div>'+\n        '<div class=\"mini\"><b class=\"num\" style=\"color:var(--red)\">'+money(iOwe)+'</b><span>You still owe</span></div>'+\n      '</div></section>';\n  } else {\n    h += '<section class=\"hero\"><div class=\"eyebrow\">'+esc(book.name)+'</div>'+\n      '<div class=\"big\" style=\"font-size:22px\">Select your player profile</div>'+\n      '<div class=\"note\">Pick who you are in this book to manage entries and personal dues.</div>'+\n      '<div class=\"chips\" style=\"margin-top:12px\">'+book.people.map(function(p){\n        return '<button class=\"chip\" data-a=\"setme\" data-id=\"'+p.id+'\">'+esc(p.name)+' <span class=\"role-badge '+bPRole(book, p.id)+'\" style=\"font-size:8px\">'+(ROLES[bPRole(book, p.id)].label)+'</span></button>';\n      }).join(\"\")+'</div></section>';\n  }\n\n  // Sent payments awaiting confirmation\n  var pout = (book.payments||[]).filter(function(p){ return p.status===\"pending\" && book.meId && p.fromId===book.meId; });\n  if (pout.length){\n    h += '<h2 class=\"sec\">Sent, Awaiting Recipient Acknowledgment</h2>';\n    h += pout.map(function(p){\n      return '<div class=\"item\"><div>'+av(book, p.toId)+'</div><div class=\"grow\"><div class=\"t\">You sent to '+esc(bPName(book, p.toId))+'</div>'+\n        '<div class=\"s\">'+fmtDT(p.date||p.at)+' · '+(p.paymentMode||\"UPI\")+' · Waiting for '+esc(bPName(book, p.toId))+' to acknowledge</div></div>'+\n        '<div class=\"amt num\" style=\"color:var(--gold)\">'+money(P(p.amount))+'</div>'+\n        '<button class=\"btn sm ghost\" data-a=\"delpay\" data-id=\"'+p.id+'\">Undo</button></div>';\n    }).join(\"\");\n  }\n\n  // Open pairwise balances\n  var ps = calcPairs(book).filter(function(p){ return p.net!==0 && (!book.meId || p.a===book.meId || p.b===book.meId); });\n  h += '<h2 class=\"sec\"><span>'+(book.meId?\"Your open balances\":\"Open balances\")+'</span>'+\n    '<button class=\"btn sm ghost\" data-a=\"share-book-whatsapp\">📲 WhatsApp Summary</button></h2>';\n  h += ps.length ? ps.slice(0,6).map(function(pr){ return renderNetStrip(book, pr); }).join(\"\")\n                 : '<div class=\"card pad sub\">Everyone in this book is square. 🎉</div>';\n\n  // Recent activity\n  var recent = (book.activities||[]).slice().sort(function(a,b){ return new Date(b.date||b.at)-new Date(a.date||a.at); }).slice(0,4);\n  if (recent.length){\n    h += '<h2 class=\"sec\">Recent Court Bookings</h2>' + recent.map(function(act){ return renderActCard(book, act); }).join(\"\");\n    if (book.activities.length>4) h += '<button class=\"btn full ghost sm\" style=\"margin-top:8px\" data-a=\"go\" data-id=\"activities\">See all '+book.activities.length+' entries</button>';\n  }\n  return h;\n}\n\nfunction onboarding(){\n  var book = activeBook();\n  return '<section class=\"hero\"><div class=\"eyebrow\">'+esc((book&&book.name)||\"New Book\")+'</div>'+\n    '<div class=\"big\" style=\"font-size:24px\">Zero-argument court bookings &amp; ledger management</div>'+\n    '<div class=\"note\">Roles for Creator, Admins, and Members. Log court slots (e.g. 8 PM–10 PM) and dues automatically offset!</div></section>'+\n    '<div class=\"empty\" style=\"margin-top:16px\"><div class=\"em\">🏸</div><h3>Add players to this book</h3>'+\n    '<p>Add your sports group. Existing players will automatically auto-suggest as you type!</p>'+\n    '<button class=\"btn pri\" data-a=\"people-sheet\">+ Add Members</button>'+\n    '<div style=\"margin-top:12px\"><button class=\"btn ghost sm\" data-a=\"demo\">Load Sample Multi-Role Court Book</button></div></div>';\n}\n\n/* SIGNATURE Net Strip */\nfunction renderNetStrip(book, pr){\n  var a = pr.a, b = pr.b;\n  var max = Math.max(pr.legAB+pr.paidBA, pr.legBA+pr.paidAB, 1);\n  var w = function(v){ return Math.max(4, Math.round(v/max*80)); };\n  var debtor = pr.net>0 ? a : b, creditor = pr.net>0 ? b : a, amt = Math.abs(pr.net);\n  var creditorPerson = bPerson(book, creditor);\n\n  var h = '<div class=\"net\"><div class=\"net-head\">'+av(book, a,\"sm\")+av(book, b,\"sm\")+\n    '<div class=\"grow\"><div class=\"t\" style=\"font-size:12px;font-weight:700\">'+esc(nameOrYou(book, a))+' &amp; '+esc(nameOrYou(book, b))+'</div></div>'+\n    (amt===0 ? pill(\"Settled\",\"var(--muted)\") : \"\")+'</div>';\n\n  h += '<div class=\"net-legs\">';\n  if (pr.legAB) h += '<div class=\"leg\"><span class=\"bar b\" style=\"width:'+w(pr.legAB)+'px\"></span>'+esc(nameOrYou(book, a))+' → '+esc(nameOrYou(book, b))+' from bookings<span class=\"lv num\">'+money(pr.legAB)+'</span></div>';\n  if (pr.legBA) h += '<div class=\"leg\"><span class=\"bar a\" style=\"width:'+w(pr.legBA)+'px\"></span>'+esc(nameOrYou(book, b))+' → '+esc(nameOrYou(book, a))+' from bookings<span class=\"lv num\">'+money(pr.legBA)+'</span></div>';\n  if (pr.paidAB) h += '<div class=\"leg\"><span class=\"bar a\" style=\"width:'+w(pr.paidAB)+'px\"></span>'+esc(nameOrYou(book, a))+' already paid<span class=\"lv num\">'+money(pr.paidAB)+'</span></div>';\n  if (pr.paidBA) h += '<div class=\"leg\"><span class=\"bar b\" style=\"width:'+w(pr.paidBA)+'px\"></span>'+esc(nameOrYou(book, b))+' already paid<span class=\"lv num\">'+money(pr.paidBA)+'</span></div>';\n  h += '</div>';\n\n  if (amt===0){\n    h += '<div class=\"settled\">Nets to zero — completely adjusted and settled!</div>';\n  } else {\n    h += '<div class=\"net-out\">'+av(book, debtor,\"sm\")+\n      '<div class=\"grow\"><div style=\"font-size:10px;color:var(--dim);text-transform:uppercase;font-weight:700\">Net Adjusted Due</div>'+\n      '<div class=\"res num\" style=\"color:var(--lime)\">'+esc(nameOrYou(book, debtor))+' owes '+esc(nameOrYou(book, creditor))+' '+money(amt)+'</div></div>'+\n      (creditorPerson && creditorPerson.upiId ? '<button class=\"btn sm ghost\" data-a=\"copy-upi\" data-upi=\"'+esc(creditorPerson.upiId)+'\" title=\"Copy UPI ID\">📋 UPI</button>' : '')+\n      '<button class=\"btn sm pri\" data-a=\"pay\" data-id=\"'+debtor+'\" data-id2=\"'+creditor+'\">Settle</button></div>';\n  }\n  return h+'</div>';\n}\n\n/* ───────── ACTIVITIES ───────── */\nfunction renderActCard(book, act){\n  var t = bTypeOf(book, act.typeId);\n  var s = calcShares(book, act), n = Object.keys(s).length, open = !!S.open[act.id];\n  var per = n ? Math.floor(P(act.amount)/n) : 0;\n  var slotDisplay = act.slotText || (act.startTime ? fmtTime(act.startTime)+(act.endTime?\" – \"+fmtTime(act.endTime):\"\") : \"\");\n  var editable = canEditEntry(book, act);\n  var deletable = canDeleteEntry(book, act);\n\n  var h = '<div class=\"act\"><button class=\"act-top\" data-a=\"expand\" data-id=\"'+act.id+'\">'+\n    '<div class=\"emo\">'+t.emoji+'</div><div class=\"grow\">'+\n    '<div class=\"t trunc\">'+esc(t.label)+(act.venue?' <span style=\"color:var(--dim);font-weight:500\">· '+esc(act.venue)+'</span>':'')+'</div>'+\n    '<div class=\"s\">'+fmtDT(act.date||act.at, slotDisplay)+' · paid by <b>'+esc(nameOrYou(book, act.payerId))+'</b></div>'+\n    '<div class=\"row\" style=\"margin-top:6px;gap:6px\"><div class=\"avstack\">'+Object.keys(s).slice(0,6).map(function(id){return av(book, id,\"sm\");}).join(\"\")+'</div>'+\n    (n>6?'<span class=\"sub\">+'+(n-6)+'</span>':'')+'<span class=\"sub\">'+n+' playing · '+money(per)+' each</span></div>'+\n    '</div><div style=\"text-align:right\"><div class=\"amt num\">'+money(P(act.amount))+'</div>'+\n    '<div class=\"s\" style=\"color:var(--lime);font-weight:700\">'+(open?\"Close\":\"Details\")+'</div></div></button>';\n\n  if (open){\n    h += '<div class=\"act-body\">';\n    Object.keys(s).forEach(function(id){\n      h += '<div class=\"brk\">'+av(book, id,\"sm\")+'<span class=\"grow trunc\">'+esc(nameOrYou(book, id))+(id===act.payerId?' <span class=\"sub\">· Booked &amp; Paid</span>':'')+'</span>'+\n        '<span class=\"num\" style=\"font-weight:700;color:'+(id===act.payerId?\"var(--teal)\":\"var(--muted)\")+'\">'+money(s[id])+'</span></div>';\n    });\n    if (act.note) h += '<div class=\"sub\" style=\"margin-top:8px;font-style:italic\">Note: '+esc(act.note)+'</div>';\n    if (editable || deletable){\n      h += '<div class=\"row\" style=\"margin-top:12px;gap:8px\">'+\n        (editable ? '<button class=\"btn sm\" data-a=\"editact\" data-id=\"'+act.id+'\">Edit</button>' : '')+\n        (deletable ? '<button class=\"btn sm danger\" data-a=\"delact\" data-id=\"'+act.id+'\">Delete</button>' : '')+\n        '</div>';\n    }\n    h += '</div>';\n  }\n  return h+'</div>';\n}\n\nfunction viewActivities(){\n  var book = activeBook();\n  if(!book || !book.activities || !book.activities.length){\n    return '<div class=\"empty\"><div class=\"em\">🗓️</div><h3>No bookings logged yet</h3><p>Log your court slot, venue, cost, and players. The split is calculated automatically.</p>'+\n      (canAddEntries(book)?'<button class=\"btn pri\" data-a=\"newact\">+ Log a Court Booking</button>':'<div class=\"sub\">View-only mode</div>')+'</div>';\n  }\n  var byDay = {}, order = [];\n  book.activities.slice().sort(function(a,b){ return new Date((b.date||b.at).split(\"T\")[0])-new Date((a.date||a.at).split(\"T\")[0]); }).forEach(function(a){\n    var k = fmtD(a.date||a.at); if(!byDay[k]){ byDay[k]=[]; order.push(k); } byDay[k].push(a);\n  });\n  var spent = book.activities.reduce(function(s,a){ return s+P(a.amount); },0);\n  var h = '<div class=\"card pad row\" style=\"margin-bottom:14px\"><div class=\"grow\"><div class=\"sub\">'+book.activities.length+' entries logged in '+esc(book.name)+'</div>'+\n    '<div class=\"amt num\" style=\"font-size:22px;color:var(--lime)\">'+money(spent)+'</div></div>'+\n    (canAddEntries(book)?'<button class=\"btn sm pri\" data-a=\"newact\">+ Add Booking</button>':'')+'</div>';\n\n  h += order.map(function(k){\n    return '<h2 class=\"sec\">'+esc(k)+'</h2>'+byDay[k].map(function(act){ return renderActCard(book, act); }).join(\"\");\n  }).join(\"\");\n  return h;\n}\n\n/* ───────── BALANCES ───────── */\nfunction viewBalances(){\n  var book = activeBook();\n  if(!book || !book.people || book.people.length<2){\n    return '<div class=\"empty\"><div class=\"em\">⚖️</div><h3>Add at least two players</h3><p>Balances calculate bilateral dues between all participants.</p><button class=\"btn pri\" data-a=\"people-sheet\">Add Players</button></div>';\n  }\n\n  var h = '<div class=\"chips\" style=\"margin-bottom:14px\">'+\n    ['pairs','everyone','settle'].map(function(m){\n      var lbl = m===\"pairs\" ? \"Between Friends\" : (m===\"everyone\" ? \"Net per Person\" : \"Fewest Transfers\");\n      return '<button class=\"chip '+(S.balMode===m?\"on\":\"\")+'\" data-a=\"balmode\" data-id=\"'+m+'\">'+lbl+'</button>';\n    }).join(\"\")+'</div>';\n\n  if (S.balMode===\"pairs\"){\n    var ps = calcPairs(book);\n    if(!ps.length) return h+'<div class=\"card pad sub\">No expenses logged yet in this book.</div>';\n    var live = ps.filter(function(p){ return p.net!==0; }), done = ps.filter(function(p){ return p.net===0; });\n    h += live.map(function(pr){ return renderNetStrip(book, pr); }).join(\"\");\n    if (done.length) h += '<h2 class=\"sec\">Squared Up / Fully Adjusted</h2>'+done.map(function(pr){ return renderNetStrip(book, pr); }).join(\"\");\n    return h;\n  }\n  if (S.balMode===\"everyone\"){\n    var rows = book.people.map(function(p){ return {p:p, b:calcBalance(book, p.id)}; }).sort(function(a,b){ return b.b-a.b; });\n    h += rows.map(function(r){\n      var c = r.b>0 ? \"var(--lime)\" : (r.b<0 ? \"var(--red)\" : \"var(--dim)\");\n      return '<button class=\"item\" data-a=\"person\" data-id=\"'+r.p.id+'\">'+av(book, r.p.id)+'<div class=\"grow\">'+\n        '<div class=\"t\">'+esc(r.p.name)+(isMeInBook(book, r.p.id)?' <span class=\"sub\">· you</span>':'')+' <span class=\"role-badge '+bPRole(book, r.p.id)+'\" style=\"font-size:8px\">'+(ROLES[bPRole(book, r.p.id)].label)+'</span></div>'+\n        '<div class=\"s\">'+(r.b>0?\"is owed by the group\":(r.b<0?\"owes the group\":\"all settled\"))+'</div></div>'+\n        '<div class=\"amt num\" style=\"color:'+c+'\">'+(r.b>0?\"+\":\"\")+money(r.b)+'</div></button>';\n    }).join(\"\");\n    return h;\n  }\n\n  // Fewest transfers\n  var su = calcSettleUp(book);\n  h += '<div class=\"card pad sub\" style=\"margin-bottom:10px\">The minimum number of payments that settles the entire book simultaneously.</div>';\n  if(!su.length) return h+'<div class=\"card pad sub\">Everyone in this book is completely square!</div>';\n  h += su.map(function(s){\n    var toPerson = bPerson(book, s.to);\n    return '<div class=\"item\">'+av(book, s.from,\"sm\")+'<span style=\"color:var(--dim)\">→</span>'+av(book, s.to,\"sm\")+\n      '<div class=\"grow\"><div class=\"t\">'+esc(nameOrYou(book, s.from))+' pays '+esc(nameOrYou(book, s.to))+'</div>'+\n      (toPerson && toPerson.upiId ? '<div class=\"s\">UPI: '+esc(toPerson.upiId)+'</div>' : '')+'</div>'+\n      '<div class=\"amt num\" style=\"color:var(--lime)\">'+money(s.v)+'</div>'+\n      '<button class=\"btn sm pri\" data-a=\"pay\" data-id=\"'+s.from+'\" data-id2=\"'+s.to+'\">Record</button></div>';\n  }).join(\"\");\n  return h;\n}\n\n/* ───────── MEMBERS & CASHBOOK SETTINGS (Screenshots 2 & 3) ───────── */\nfunction viewPeople(){\n  var book = activeBook();\n  if(!book) return \"\";\n\n  var h = '<div class=\"card pad\" style=\"margin-bottom:14px\">'+\n    '<div class=\"row\"><div class=\"mark\">'+(book.emoji||\"🏸\")+'</div>'+\n    '<div class=\"grow\"><label class=\"lb\">Book Settings</label>'+\n    '<div class=\"t\" style=\"font-size:16px\">'+esc(book.name)+'</div>'+\n    '<div class=\"sub\">'+(book.people?book.people.length:0)+' members · Mode: '+ROLES[myRole(book)].label+'</div></div>'+\n    '<button class=\"btn sm ghost\" data-a=\"roles-sheet\">Roles &amp; Perms ℹ️</button></div></div>';\n\n  h += '<h2 class=\"sec\"><span>Members ('+book.people.length+')</span>'+\n    '<button class=\"btn sm pri\" data-a=\"people-sheet\">+ Add Member</button></h2>';\n\n  h += book.people.length ? book.people.map(function(p){\n    var b = calcBalance(book, p.id), c = b>0?\"var(--lime)\":(b<0?\"var(--red)\":\"var(--dim)\");\n    var rKey = p.role || \"data_operator\";\n    return '<div class=\"item\">'+av(book, p.id)+\n      '<div class=\"grow\" style=\"cursor:pointer\" data-a=\"person\" data-id=\"'+p.id+'\"><div class=\"t\">'+esc(p.name)+\n      ' <span class=\"role-badge '+rKey+'\">'+(ROLES[rKey].label)+'</span></div>'+\n      '<div class=\"s\">'+(isMeInBook(book, p.id)?\"(You) · \":\"\")+(p.mobile?p.mobile+\" · \":\"\")+(b===0?\"settled\":(b>0?\"owed \"+money(b):\"owes \"+money(-b)))+'</div></div>'+\n      (p.upiId ? '<span class=\"pill\" style=\"background:rgba(56,189,248,.15);color:var(--blue)\">UPI</span>' : '')+\n      '<div class=\"amt num\" style=\"color:'+c+';font-size:13px\">'+(b>0?\"+\":\"\")+money(b)+'</div>'+\n      (canManageBookSettings(book) ? '<button class=\"btn sm ghost\" data-a=\"edit-member-role\" data-id=\"'+p.id+'\" title=\"Change Role\">⚙️</button>' : '')+\n      '</div>';\n  }).join(\"\") : '<div class=\"card pad sub\">No players yet.</div>';\n\n  h += '<h2 class=\"sec\"><span>Role Simulation / Switch Identity</span></h2>'+\n    '<div class=\"card pad\"><div class=\"sub\" style=\"margin-bottom:8px\">Test how the app looks and restricts permissions for each role:</div>'+\n    '<div class=\"chips\">'+book.people.map(function(p){\n      var isCur = isMeInBook(book, p.id);\n      return '<button class=\"chip '+(isCur?\"on\":\"\")+'\" data-a=\"setme\" data-id=\"'+p.id+'\">'+esc(p.name)+' ('+ROLES[bPRole(book, p.id)].label.split(\" \")[0]+')</button>';\n    }).join(\"\")+'</div></div>';\n\n  h += '<h2 class=\"sec\">Manage Books &amp; Backup</h2><div class=\"stack\">'+\n    '<button class=\"btn full\" data-a=\"share-invite\">🔗 Share Book Invite Link</button>'+\n    '<button class=\"btn full\" data-a=\"books-sheet\">📚 Switch or Create Another Book</button>'+\n    '<button class=\"btn full\" data-a=\"allbooks-view\">🌐 Global Ledger (All Books Summary)</button>'+\n    '<div class=\"two\"><button class=\"btn\" data-a=\"export\">Export Backup</button><button class=\"btn\" data-a=\"import\">Import Backup</button></div>'+\n    (canDeleteBook(book) ? '<button class=\"btn full danger\" data-a=\"reset-book\">Reset Current Book (Creator Only)</button>' : '')+'</div>';\n\n  return h;\n}\n\n/* ───────── GLOBAL VIEW: ALL BOOKS SUMMARY ───────── */\nfunction viewAllBooks(){\n  var totalOwedToMe = 0, totalIOwe = 0;\n  var summaryRows = DB.books.map(function(b){\n    var me = b.meId ? bPerson(b, b.meId) : null;\n    var netBal = me ? calcBalance(b, me.id) : 0;\n    if(netBal > 0) totalOwedToMe += netBal;\n    else if(netBal < 0) totalIOwe += -netBal;\n    return { book: b, me: me, balance: netBal };\n  });\n\n  var overall = totalOwedToMe - totalIOwe;\n  var h = '<section class=\"hero\">'+\n    '<div class=\"eyebrow\">Cross-Book Global Ledger</div>'+\n    '<div class=\"big num\" style=\"color:'+(overall>0?\"var(--lime)\":(overall<0?\"var(--red)\":\"var(--text)\"))+'\">'+money(Math.abs(overall))+'</div>'+\n    '<div class=\"note\">'+(overall>0?\"Across all your books, you are owed money in total.\":(overall<0?\"Across all your books, you owe money in total.\":\"You are all square across all books!\"))+'</div>'+\n    '<div class=\"split2\">'+\n      '<div class=\"mini\"><b class=\"num\" style=\"color:var(--teal)\">'+money(totalOwedToMe)+'</b><span>Total Owed to You</span></div>'+\n      '<div class=\"mini\"><b class=\"num\" style=\"color:var(--red)\">'+money(totalIOwe)+'</b><span>Total You Owe</span></div>'+\n    '</div></section>';\n\n  h += '<h2 class=\"sec\"><span>Your Active Books ('+DB.books.length+')</span><button class=\"btn sm pri\" data-a=\"create-book\">+ New Book</button></h2>';\n  h += summaryRows.map(function(row){\n    var c = row.balance>0 ? \"var(--lime)\" : (row.balance<0 ? \"var(--red)\" : \"var(--dim)\");\n    return '<div class=\"card pad row\" style=\"margin-bottom:8px\">'+\n      '<div class=\"mark\">'+(row.book.emoji||\"🏸\")+'</div>'+\n      '<div class=\"grow\"><div class=\"t\" style=\"font-size:14px;font-weight:700\">'+esc(row.book.name)+'</div>'+\n      '<div class=\"s\">'+(row.book.people?row.book.people.length:0)+' players · '+(row.book.activities?row.book.activities.length:0)+' bookings</div></div>'+\n      '<div style=\"text-align:right\"><div class=\"amt num\" style=\"color:'+c+'\">'+(row.balance>0?\"+\":\"\")+money(row.balance)+'</div>'+\n      '<button class=\"btn sm ghost\" data-a=\"switchbook\" data-id=\"'+row.book.id+'\" style=\"color:var(--lime);font-weight:700\">Open →</button></div></div>';\n  }).join(\"\");\n\n  h += '<button class=\"btn full ghost\" style=\"margin-top:12px\" data-a=\"go\" data-id=\"home\">← Back to Current Book</button>';\n  return h;\n}\n\n/* ───────── SHEETS ───────── */\nfunction sheetWrap(title, body, sub){\n  return '<div class=\"ovl\" data-a=\"closeovl\"><div class=\"sheet\" role=\"dialog\" aria-modal=\"true\">'+\n    '<div class=\"grab\"></div><div class=\"sheet-hd\"><div class=\"grow\"><h3>'+title+'</h3>'+(sub?'<div class=\"sub\">'+sub+'</div>':'')+'</div>'+\n    '<button class=\"icon-btn\" data-a=\"closesheet\" aria-label=\"Close\">✕</button></div>'+body+'</div></div>';\n}\n\n/* Activity Sheet */\nfunction activitySheet(){\n  var book = activeBook(); if(!book) return \"\";\n  var d = S.draft, t = bTypeOf(book, d.typeId);\n  var n = d.parts.length, amt = P(d.amount);\n  var venues = {}; (book.activities||[]).forEach(function(a){ if(a.venue) venues[a.venue]=1; });\n\n  var body = '<div class=\"field\"><label class=\"lb\">Activity Type</label><div class=\"chips\">'+\n    (book.types||[]).map(function(x){\n      return '<button class=\"chip '+(x.id===d.typeId?\"on\":\"\")+'\" data-a=\"dtype\" data-id=\"'+x.id+'\">'+x.emoji+' '+esc(x.label)+'</button>';\n    }).join(\"\")+\n    '<button class=\"chip\" data-a=\"newtype\">+</button></div></div>';\n\n  body += '<div class=\"field\"><label class=\"lb\">Total Amount Paid (₹)</label>'+\n    '<input class=\"in big num\" id=\"f-amount\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"1\" placeholder=\"0\" value=\"'+(d.amount||\"\")+'\"></div>';\n\n  body += '<div class=\"field\"><label class=\"lb\">Booked &amp; Paid by</label><div class=\"chips\">'+\n    book.people.map(function(p){\n      return '<button class=\"chip '+(p.id===d.payerId?\"on\":\"\")+'\" data-a=\"dpayer\" data-id=\"'+p.id+'\">'+esc(p.name)+(isMeInBook(book, p.id)?\" (you)\":\"\")+'</button>';\n    }).join(\"\")+'</div></div>';\n\n  // Date & Time Slot\n  body += '<div class=\"field two\"><div><label class=\"lb\">Date</label><input class=\"in\" id=\"f-date\" type=\"date\" value=\"'+esc(d.date)+'\"></div>'+\n    '<div><label class=\"lb\">Time Option</label><div class=\"chips\" style=\"margin-top:2px\">'+\n    '<button class=\"chip '+(d.timeMode==='slot'?'on':'')+'\" data-a=\"dtime-mode\" data-id=\"slot\">Slot Range</button>'+\n    '<button class=\"chip '+(d.timeMode==='none'?'on':'')+'\" data-a=\"dtime-mode\" data-id=\"none\">No Time</button></div></div></div>';\n\n  if(d.timeMode==='slot'){\n    body += '<div class=\"field two\"><div><label class=\"lb\">Start Time</label><input class=\"in\" id=\"f-start-time\" type=\"time\" value=\"'+esc(d.startTime||\"20:00\")+'\"></div>'+\n      '<div><label class=\"lb\">End Time</label><input class=\"in\" id=\"f-end-time\" type=\"time\" value=\"'+esc(d.endTime||\"22:00\")+'\"></div></div>'+\n      '<div class=\"chips\" style=\"margin-top:6px\"><span class=\"sub\" style=\"align-self:center\">Quick duration:</span>'+\n      ['1 hr','1.5 hrs','2 hrs','3 hrs'].map(function(dur){\n        return '<button class=\"chip sm\" data-a=\"set-dur\" data-id=\"'+dur+'\">'+dur+'</button>';\n      }).join(\"\")+'</div>';\n  }\n\n  body += '<div class=\"field\" style=\"margin-top:14px\"><label class=\"lb\">Venue / Sports Arena</label>'+\n    '<input class=\"in\" id=\"f-venue\" list=\"venues\" placeholder=\"e.g. ASC Sports Club, Andheri\" value=\"'+esc(d.venue)+'\">'+\n    '<datalist id=\"venues\">'+Object.keys(venues).map(function(v){return '<option value=\"'+esc(v)+'\">';}).join(\"\")+'</datalist></div>';\n\n  body += '<div class=\"field\"><div class=\"row\" style=\"margin-bottom:6px\"><label class=\"lb\" style=\"margin:0\">Players Involved ('+n+')</label>'+\n    '<button class=\"btn sm ghost\" style=\"margin-left:auto\" data-a=\"dall\">'+(n===book.people.length?\"Clear All\":\"Select All\")+'</button></div>'+\n    '<div class=\"chips\">'+book.people.map(function(p){\n      var on = d.parts.indexOf(p.id)>=0;\n      return '<button class=\"chip '+(on?\"on\":\"\")+'\" data-a=\"dpart\" data-id=\"'+p.id+'\">'+(on?\"✓ \":\"\")+esc(p.name)+'</button>';\n    }).join(\"\")+\n    '<button class=\"chip\" data-a=\"quickp\">+ New Member</button></div></div>';\n\n  body += '<div class=\"card pad\" id=\"preview\" style=\"margin-top:14px;border-color:rgba(163,230,53,.3);background:rgba(163,230,53,.07)\">'+previewHTML(book)+'</div>';\n\n  body += '<div class=\"field\"><label class=\"lb\">Notes (optional)</label><input class=\"in\" id=\"f-note\" placeholder=\"e.g. Court 2, 8 PM to 10 PM session\" value=\"'+esc(d.note||\"\")+'\"></div>';\n\n  body += '<div class=\"stack\" style=\"margin-top:18px\"><button class=\"btn pri full\" data-a=\"saveact\">'+(d.id?\"Save Changes\":\"Add to Ledger\")+'</button></div>';\n\n  return sheetWrap(d.id?\"Edit Booking\":\"Log Court Booking\", body, d.id?\"\":\"Evenly splits the cost and automatically offsets past dues\");\n}\n\nfunction previewHTML(book){\n  var d = S.draft, n = d.parts.length, amt = P(d.amount);\n  if (!amt || !n) return '<div class=\"sub\">Enter the total amount and select playing members to preview individual splits.</div>';\n  var per = Math.floor(amt/n), rem = amt - per*n;\n  var payerIn = d.parts.indexOf(d.payerId)>=0;\n  var h = '<div class=\"row\"><div class=\"grow\"><div class=\"sub\">Split '+n+' ways</div>'+\n    '<div class=\"amt num\" style=\"font-size:22px;color:var(--lime)\">'+money(per)+' each</div></div>'+\n    '<div style=\"text-align:right\"><div class=\"sub\">'+(payerIn?\"Covered for others:\":\"Payer not playing:\")+'</div>'+\n    '<div class=\"num\" style=\"font-weight:700;font-size:16px\">'+money(amt - (payerIn?per+rem:0))+'</div></div></div>';\n  if (rem) h += '<div class=\"sub\" style=\"margin-top:6px\">'+(payerIn?esc(bPName(book, d.payerId))+\" covers odd \"+money(rem):\"Odd \"+money(rem)+\" distributed\")+'</div>';\n  return h;\n}\nfunction refreshPreview(){ var el = document.getElementById(\"preview\"); if(el) el.innerHTML = previewHTML(activeBook()); }\n\n/* Two-Party Settle & Record Payment Sheet */\nfunction paymentSheet(){\n  var book = activeBook(); if(!book) return \"\";\n  var d = S.draft;\n  var toPerson = bPerson(book, d.toId);\n  var suggested = Math.abs(calcNet(book, d.fromId, d.toId));\n\n  var body = '<div class=\"card pad\" style=\"margin-bottom:14px\"><div class=\"row\">'+av(book, d.fromId,\"sm\")+\n    '<span style=\"color:var(--dim)\">pays</span>'+av(book, d.toId,\"sm\")+\n    '<div class=\"grow\"><div class=\"t\" style=\"font-size:13px;font-weight:700\">'+esc(nameOrYou(book, d.fromId))+' → '+esc(nameOrYou(book, d.toId))+'</div>'+\n    '<div class=\"sub\">Net Due after Auto-offset: '+money(suggested)+'</div></div></div></div>';\n\n  if (toPerson && (toPerson.upiId || toPerson.qrImage)){\n    body += '<div class=\"upi-card\"><div class=\"row\"><div class=\"mark\" style=\"font-size:14px\">⚡</div>'+\n      '<div class=\"grow\"><div class=\"t\" style=\"font-size:12px\">Pay directly to '+esc(toPerson.name)+'</div>'+\n      (toPerson.upiId ? '<div class=\"sub num\" style=\"font-weight:700;color:var(--text)\">'+esc(toPerson.upiId)+'</div>' : '')+'</div>'+\n      (toPerson.upiId ? '<button class=\"btn sm\" data-a=\"copy-upi\" data-upi=\"'+esc(toPerson.upiId)+'\">Copy UPI</button>' : '')+\n      (toPerson.qrImage ? '<button class=\"btn sm teal\" data-a=\"show-qr\" data-id=\"'+toPerson.id+'\">View QR</button>' : '')+\n      '</div>';\n\n    if (toPerson.upiId){\n      var amtPay = Number(d.amount) || (suggested/100);\n      var upiUrl = 'upi://pay?pa='+encodeURIComponent(toPerson.upiId)+'&pn='+encodeURIComponent(toPerson.name)+'&am='+amtPay+'&cu=INR&tn='+encodeURIComponent('Court booking settlement');\n      body += '<a href=\"'+upiUrl+'\" class=\"btn full pri sm\" style=\"text-decoration:none;margin-top:4px\">🚀 Launch UPI App (GPay / PhonePe / Paytm)</a>';\n    }\n    body += '</div>';\n  }\n\n  body += '<div class=\"field\" style=\"margin-top:14px\"><label class=\"lb\">Amount Settled (₹)</label>'+\n    '<input class=\"in big num\" id=\"p-amount\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"1\" value=\"'+(d.amount||\"\")+'\"></div>';\n\n  body += '<div class=\"field\"><label class=\"lb\">Payment Mode</label><div class=\"chips\">'+\n    ['UPI','Cash','Bank Transfer','GPay','Paytm'].map(function(pm){\n      return '<button class=\"chip '+(d.paymentMode===pm?\"on\":\"\")+'\" data-a=\"pmode\" data-id=\"'+pm+'\">'+pm+'</button>';\n    }).join(\"\")+'</div></div>';\n\n  body += '<div class=\"field two\"><div><label class=\"lb\">Date</label><input class=\"in\" id=\"p-date\" type=\"date\" value=\"'+esc(d.date)+'\"></div>'+\n    '<div><label class=\"lb\">Time</label><input class=\"in\" id=\"p-time\" type=\"time\" value=\"'+esc(d.time)+'\"></div></div>';\n\n  body += '<div class=\"field\"><label class=\"lb\">Reference Note (optional)</label><input class=\"in\" id=\"p-note\" placeholder=\"Transaction ID, UPI Ref…\" value=\"'+esc(d.note||\"\")+'\"></div>';\n\n  // Two-party acknowledgment explanation\n  body += '<div class=\"notif-banner\" style=\"margin-top:16px\"><div style=\"font-size:20px\">🔔</div>'+\n    '<div class=\"sub\" style=\"color:var(--text)\"><b>Two-Party Acknowledgment:</b> When you tap <b>\"Mark as Paid\"</b>, '+esc(bPName(book, d.toId))+' will receive a notification to acknowledge receipt. Once confirmed, dues will officially clear.</div></div>';\n\n  body += '<button class=\"btn pri full\" style=\"margin-top:14px\" data-a=\"savepay\">✅ Mark as Paid</button>';\n  return sheetWrap(\"Settle &amp; Record Payment\", body);\n}\n\n/* Person Profile Sheet */\nfunction personSheet(){\n  var book = activeBook(); if(!book) return \"\";\n  var pid = S.draft.id, p = bPerson(book, pid); if(!p) return \"\";\n  var b = calcBalance(book, pid), rows = calcLedgerFor(book, pid);\n\n  var peerLines = [];\n  book.people.forEach(function(o){\n    if(o.id===pid) return;\n    var n = calcNet(book, o.id, pid);\n    if(n !== 0){\n      peerLines.push({\n        otherId: o.id,\n        otherName: o.name,\n        net: n,\n        upi: o.upiId\n      });\n    }\n  });\n\n  var body = '<div class=\"card pad\" style=\"margin-bottom:14px\"><div class=\"row\">'+av(book, pid,\"lg\")+\n    '<div class=\"grow\"><div style=\"font-size:17px;font-weight:800\">'+esc(p.name)+' <span class=\"role-badge '+bPRole(book, pid)+'\">'+(ROLES[bPRole(book, pid)].label)+'</span></div>'+\n    (p.mobile ? '<div class=\"sub\">📱 '+esc(p.mobile)+'</div>' : '')+\n    '<div class=\"sub\">'+(b===0?\"All settled\":(b>0?\"is owed by the group\":\"owes the group\"))+'</div></div>'+\n    '<div class=\"amt num\" style=\"font-size:22px;color:'+(b>0?\"var(--lime)\":(b<0?\"var(--red)\":\"var(--dim)\"))+'\">'+(b>0?\"+\":\"\")+money(b)+'</div></div>';\n\n  // UPI & QR Section\n  body += '<div class=\"upi-card\" style=\"margin-top:10px\">';\n  body += '<div class=\"row\"><div class=\"mark\" style=\"font-size:14px\">💳</div>'+\n    '<div class=\"grow\"><div class=\"t\" style=\"font-size:12px\">UPI Payment Details</div>'+\n    '<div class=\"sub num\" style=\"font-weight:700\">'+(p.upiId ? esc(p.upiId) : 'No UPI ID added')+'</div></div>'+\n    (p.upiId ? '<button class=\"btn sm\" data-a=\"copy-upi\" data-upi=\"'+esc(p.upiId)+'\">📋 Copy UPI</button>' : '')+\n    '</div>';\n\n  if (p.qrImage){\n    body += '<div class=\"row\" style=\"margin-top:6px\">'+\n      '<div style=\"font-size:12px;color:var(--muted)\">QR Code scanner attached</div>'+\n      '<button class=\"btn sm teal\" style=\"margin-left:auto\" data-a=\"show-qr\" data-id=\"'+p.id+'\">🔍 View QR Code</button>'+\n      '</div>';\n  }\n  body += '</div>';\n\n  // Action Buttons\n  body += '<div class=\"row\" style=\"margin-top:12px;gap:8px\">'+\n    (isMeInBook(book, pid)?\"\":'<button class=\"btn sm\" data-a=\"setme\" data-id=\"'+pid+'\">Set as Me</button>')+\n    '<button class=\"btn sm\" data-a=\"edit-profile\" data-id=\"'+pid+'\">✏️ Edit Profile &amp; UPI</button>'+\n    (canManageBookSettings(book) ? '<button class=\"btn sm danger\" data-a=\"delp\" data-id=\"'+pid+'\">Remove</button>' : '')+'</div></div>';\n\n  // Peer-to-Peer Netting Breakdown Box\n  body += '<h2 class=\"sec\">Live Peer-to-Peer Net Breakdown</h2>';\n  if(peerLines.length){\n    body += peerLines.map(function(pl){\n      var isOwed = pl.net > 0;\n      return '<div class=\"item\" style=\"padding:10px 12px\"><div>'+av(book, pl.otherId,\"sm\")+'</div>'+\n        '<div class=\"grow\"><div class=\"t\" style=\"font-size:12px\">'+(isOwed ? esc(pl.otherName)+' owes '+esc(p.name) : esc(p.name)+' owes '+esc(pl.otherName))+'</div></div>'+\n        '<div class=\"amt num\" style=\"font-size:13px;color:'+(isOwed?\"var(--lime)\":\"var(--red)\")+'\">'+money(Math.abs(pl.net))+'</div></div>';\n    }).join(\"\");\n  } else {\n    body += '<div class=\"card pad sub\">100% square with every player in this book.</div>';\n  }\n\n  // Account Log\n  body += '<h2 class=\"sec\">Transaction History Log</h2>';\n  body += rows.length ? rows.map(function(r){\n    return '<div class=\"item\" style=\"align-items:flex-start\"><div class=\"grow\"><div class=\"t\" style=\"font-size:12px\">'+r.ttl+'</div>'+\n      '<div class=\"s\">'+esc(r.sub)+' · '+fmtD(r.at)+'</div></div>'+\n      '<div style=\"text-align:right\"><div class=\"num\" style=\"font-weight:800;color:'+(r.delta>0?\"var(--lime)\":\"var(--red)\")+'\">'+(r.delta>0?\"+\":\"−\")+money(Math.abs(r.delta))+'</div>'+\n      '<div class=\"s num\">bal '+(r.run>0?\"+\":\"\")+money(r.run)+'</div></div></div>';\n  }).join(\"\") : '<div class=\"card pad sub\">No transactions logged yet.</div>';\n\n  return sheetWrap(esc(p.name)+\" Profile\", body);\n}\n\n/* Edit Player Profile & UPI Sheet */\nfunction editProfileSheet(){\n  var book = activeBook(); if(!book) return \"\";\n  var pid = S.draft.id, p = bPerson(book, pid); if(!p) return \"\";\n\n  var body = '<div class=\"field\"><label class=\"lb\">Full Name</label>'+\n    '<input class=\"in\" id=\"ep-name\" value=\"'+esc(p.name)+'\" placeholder=\"e.g. Sumeet Shetty\"></div>';\n\n  body += '<div class=\"field\"><label class=\"lb\">Mobile Number</label>'+\n    '<input class=\"in\" id=\"ep-mobile\" type=\"tel\" value=\"'+esc(p.mobile||\"\")+'\" placeholder=\"e.g. 9820011223\"></div>';\n\n  body += '<div class=\"field\"><label class=\"lb\">UPI ID (VPA)</label>'+\n    '<input class=\"in\" id=\"ep-upi\" value=\"'+esc(p.upiId||\"\")+'\" placeholder=\"e.g. sumeet@oksbi or 9820011223@paytm\"></div>';\n\n  if (canManageBookSettings(book)){\n    body += '<div class=\"field\"><label class=\"lb\">Member Role</label><div class=\"chips\">'+\n      Object.keys(ROLES).map(function(rKey){\n        return '<button class=\"chip '+(p.role===rKey?\"on\":\"\")+'\" data-a=\"set-member-role\" data-id=\"'+rKey+'\">'+ROLES[rKey].icon+' '+ROLES[rKey].label+'</button>';\n      }).join(\"\")+'</div></div>';\n  }\n\n  body += '<div class=\"field\"><label class=\"lb\">UPI Scanner QR Code Image</label>'+\n    '<div class=\"qr-preview\" id=\"qr-preview-box\">'+\n    (p.qrImage ? '<img src=\"'+p.qrImage+'\" alt=\"UPI QR\">' : '<span class=\"sub\" style=\"text-align:center;padding:10px\">No QR Image uploaded yet</span>')+\n    '</div>'+\n    '<div class=\"row\" style=\"margin-top:8px;justify-content:center;gap:8px\">'+\n    '<button class=\"btn sm pri\" data-a=\"upload-qr\">Upload QR Image</button>'+\n    (p.qrImage ? '<button class=\"btn sm danger\" data-a=\"remove-qr\">Remove QR</button>' : '')+\n    '</div></div>';\n\n  body += '<button class=\"btn pri full\" style=\"margin-top:18px\" data-a=\"save-profile\" data-id=\"'+pid+'\">Save Profile</button>';\n  return sheetWrap(\"Edit Player Profile\", body);\n}\n\n/* CashBook-Style Roles & Permissions Sheet (Screenshot 4) */\nfunction rolesSheet(){\n  var curRole = S.roleInfoTab || \"primary_admin\";\n  var rInfo = ROLES[curRole];\n\n  var body = '<div class=\"chips\" style=\"margin-bottom:14px\">'+\n    Object.keys(ROLES).map(function(rk){\n      return '<button class=\"chip '+(rk===curRole?\"on\":\"\")+'\" data-a=\"role-tab\" data-id=\"'+rk+'\">'+ROLES[rk].icon+' '+ROLES[rk].label+'</button>';\n    }).join(\"\")+'</div>';\n\n  var perms = {\n    primary_admin: {\n      can: [\n        \"Full Creator control: Delete or rename book\",\n        \"Add, change roles or remove members\",\n        \"Add & edit court bookings and payments\",\n        \"View everyone's ledger & export reports\",\n        \"Configure Data Operator & Book permissions\"\n      ],\n      cannot: []\n    },\n    book_admin: {\n      can: [\n        \"Manage book members & assign Data Operator/Viewer roles\",\n        \"Add & edit all court bookings and payments in this book\",\n        \"Confirm payment receipt on behalf of recipients\",\n        \"View everyone's ledger history & net balances\"\n      ],\n      cannot: [\n        \"Cannot delete or reset the entire book (Creator only)\"\n      ]\n    },\n    data_operator: {\n      can: [\n        \"Add new court bookings and split expenses\",\n        \"Record & mark payments as paid\",\n        \"View everyone's ledger history and net balances\",\n        \"Edit and manage their own logged bookings\"\n      ],\n      cannot: [\n        \"Cannot edit or delete other members' logged bookings\",\n        \"Cannot change member roles or remove members\",\n        \"Cannot delete or reset the book\"\n      ]\n    },\n    viewer: {\n      can: [\n        \"View real-time balances and who owes whom\",\n        \"View transaction history and full account logs\",\n        \"View QR codes and copy UPI IDs\"\n      ],\n      cannot: [\n        \"Cannot add, edit or delete any booking or payment entry\"\n      ]\n    }\n  };\n\n  var pList = perms[curRole];\n\n  body += '<div class=\"card pad\" style=\"margin-bottom:12px\">'+\n    '<div class=\"row\"><div class=\"mark\" style=\"font-size:18px\">'+rInfo.icon+'</div>'+\n    '<div class=\"grow\"><div style=\"font-weight:800;font-size:15px\">'+rInfo.label+'</div>'+\n    '<div class=\"sub\">'+rInfo.desc+'</div></div></div></div>';\n\n  body += '<h2 class=\"sec\">Permissions Granted</h2><div class=\"stack\">';\n  pList.can.forEach(function(c){\n    body += '<div class=\"item\" style=\"padding:8px 12px\"><span style=\"color:var(--lime);font-size:16px\">✅</span><span class=\"sub\" style=\"color:var(--text);font-weight:600\">'+c+'</span></div>';\n  });\n  body += '</div>';\n\n  if (pList.cannot.length){\n    body += '<h2 class=\"sec\">Restrictions</h2><div class=\"stack\">';\n    pList.cannot.forEach(function(cn){\n      body += '<div class=\"item\" style=\"padding:8px 12px\"><span style=\"color:var(--red);font-size:16px\">❌</span><span class=\"sub\" style=\"color:var(--text);font-weight:600\">'+cn+'</span></div>';\n    });\n    body += '</div>';\n  }\n\n  body += '<button class=\"btn pri full\" style=\"margin-top:16px\" data-a=\"closesheet\">Close</button>';\n  return sheetWrap(\"Roles &amp; Permissions\", body, \"CashBook role hierarchy\");\n}\n\n/* Add Member Sheet with Global Autocomplete (Screenshot 2) */\nfunction peopleSheet(){\n  var book = activeBook(); if(!book) return \"\";\n  var q = (S.searchQuery||\"\").toLowerCase().trim();\n\n  // Search existing global directory\n  var suggestions = (DB.globalDirectory||[]).filter(function(g){\n    var alreadyIn = (book.people||[]).some(function(p){ return p.name.toLowerCase() === g.name.toLowerCase(); });\n    if(alreadyIn) return false;\n    return !q || g.name.toLowerCase().indexOf(q) >= 0 || (g.mobile && g.mobile.indexOf(q) >= 0);\n  });\n\n  var body = '<div class=\"field\"><label class=\"lb\">Member Name</label>'+\n    '<input class=\"in\" id=\"newp-input\" placeholder=\"Type name (auto-suggests from contacts)\" value=\"'+esc(S.searchQuery||\"\")+'\" autocomplete=\"off\"></div>';\n\n  if (suggestions.length){\n    body += '<div class=\"sub\" style=\"margin-top:8px\">Suggested from your global contacts:</div>'+\n      '<div class=\"suggest-box\">'+\n      suggestions.slice(0,5).map(function(sug){\n        return '<div class=\"suggest-item\" data-a=\"pick-suggest\" data-name=\"'+esc(sug.name)+'\" data-mobile=\"'+esc(sug.mobile)+'\" data-upi=\"'+esc(sug.upiId)+'\">'+\n          '<div class=\"av sm\" style=\"background:'+sug.color+'\">'+esc(initials(sug.name))+'</div>'+\n          '<div class=\"grow\"><div style=\"font-weight:700;font-size:12px\">'+esc(sug.name)+'</div>'+\n          '<div class=\"sub\">'+(sug.mobile?sug.mobile+\" · \":\"\")+(sug.upiId?'UPI: '+sug.upiId:'')+'</div></div>'+\n          '<button class=\"btn sm pri\">+ Add</button></div>';\n      }).join(\"\")+'</div>';\n  }\n\n  body += '<div class=\"field two\" style=\"margin-top:12px\"><div><label class=\"lb\">Mobile Number (Optional)</label>'+\n    '<input class=\"in\" id=\"newp-mobile\" type=\"tel\" placeholder=\"e.g. 9820011223\"></div>'+\n    '<div><label class=\"lb\">UPI ID (Optional)</label><input class=\"in\" id=\"newp-upi\" placeholder=\"e.g. name@oksbi\"></div></div>';\n\n  body += '<div class=\"field\"><label class=\"lb\">Assign Role</label><div class=\"chips\">'+\n    ['data_operator','book_admin','viewer'].map(function(rk, idx){\n      return '<button class=\"chip '+(idx===0?\"on\":\"\")+'\" data-a=\"newp-role\" data-id=\"'+rk+'\">'+ROLES[rk].icon+' '+ROLES[rk].label+'</button>';\n    }).join(\"\")+'</div></div>';\n\n  body += '<button class=\"btn pri full\" style=\"margin-top:16px\" data-a=\"add-new-member\">+ Add Member to Book</button>';\n  return sheetWrap(\"Add Member to \"+esc(book.name), body, \"Add new player or pick from existing directory\");\n}\n\n/* View Fullscreen QR Code Sheet */\nfunction qrViewSheet(){\n  var book = activeBook(); if(!book) return \"\";\n  var p = bPerson(book, S.qrTargetPersonId); if(!p || !p.qrImage) return \"\";\n\n  var body = '<div style=\"text-align:center;padding:10px 0\">'+\n    '<div style=\"font-size:16px;font-weight:800\">'+esc(p.name)+'’s UPI QR Code</div>'+\n    (p.upiId ? '<div class=\"sub num\" style=\"font-size:13px;font-weight:700;margin-top:4px\">'+esc(p.upiId)+'</div>' : '')+\n    '<div class=\"qr-preview\" style=\"width:240px;height:240px;margin:16px auto;padding:6px\">'+\n    '<img src=\"'+p.qrImage+'\" alt=\"QR Code\" style=\"width:100%;height:100%;object-fit:contain\">'+\n    '</div>'+\n    '<p class=\"sub\">Scan using any UPI App (Google Pay, PhonePe, Paytm, BHIM) to settle your court dues directly.</p>'+\n    (p.upiId ? '<button class=\"btn pri full\" data-a=\"copy-upi\" data-upi=\"'+esc(p.upiId)+'\" style=\"margin-top:12px\">📋 Copy UPI ID</button>' : '')+\n    '</div>';\n\n  return sheetWrap(\"UPI QR Scanner\", body);\n}\n\n/* Multi-Book Switcher Sheet */\nfunction booksSheet(){\n  var body = '<div class=\"stack\" style=\"margin-bottom:14px\">';\n  DB.books.forEach(function(b){\n    var isCur = b.id === DB.activeBookId;\n    body += '<div class=\"card pad row\" style=\"'+(isCur?'border-color:var(--lime);background:rgba(163,230,53,.07)':'')+'\">'+\n      '<div class=\"mark\">'+(b.emoji||\"🏸\")+'</div>'+\n      '<div class=\"grow\"><div class=\"t\" style=\"font-weight:700\">'+esc(b.name)+'</div>'+\n      '<div class=\"s\">'+(b.people?b.people.length:0)+' members · '+(b.activities?b.activities.length:0)+' bookings</div></div>'+\n      (isCur ? '<span class=\"pill\" style=\"background:var(--lime);color:#060a12\">Active</span>'\n             : '<button class=\"btn sm\" data-a=\"switchbook\" data-id=\"'+b.id+'\">Switch</button>')+\n      '</div>';\n  });\n  body += '</div>';\n\n  body += '<button class=\"btn pri full\" data-a=\"create-book\">+ Create New Book</button>';\n  body += '<button class=\"btn full ghost\" style=\"margin-top:8px\" data-a=\"allbooks-view\">🌐 Global Ledger Overview</button>';\n  return sheetWrap(\"Your Court Books\", body, \"Switch between different groups of players\");\n}\n\n/* Create New Book Sheet */\nfunction createBookSheet(){\n  var emojis = [\"🏸\",\"🏓\",\"🎾\",\"⚽\",\"🏏\",\"🏀\",\"🏐\",\"🏊\",\"⛳\",\"🏃\"];\n  var body = '<div class=\"field\"><label class=\"lb\">Book / Group Name</label>'+\n    '<input class=\"in\" id=\"nb-name\" placeholder=\"e.g. Tuesday Badminton Crew or Weekend Pickleball\"></div>';\n\n  body += '<div class=\"field\"><label class=\"lb\">Sport Icon</label><div class=\"chips\">'+\n    emojis.map(function(em, i){\n      return '<button class=\"chip '+(i===0?'on':'')+'\" data-a=\"nb-emoji\" data-id=\"'+em+'\" style=\"font-size:18px\">'+em+'</button>';\n    }).join(\"\")+'</div></div>';\n\n  body += '<button class=\"btn pri full\" style=\"margin-top:18px\" data-a=\"save-new-book\">Create Book</button>';\n  return sheetWrap(\"Create New Book\", body);\n}\n\n/* Share & Invite Sheet */\nfunction inviteSheet(){\n  var book = activeBook(); if(!book) return \"\";\n  var inviteCode = btoa(JSON.stringify({ id: book.id, name: book.name, emoji: book.emoji }));\n  var shareUrl = window.location.origin + window.location.pathname + \"#invite=\" + inviteCode;\n\n  var body = '<div class=\"empty\" style=\"margin-bottom:14px\"><div class=\"em\">'+(book.emoji||\"🏸\")+'</div>'+\n    '<h3>Invite Players to '+esc(book.name)+'</h3>'+\n    '<p>Share this link with your sports group. Members can join the book, view their real-time dues, and log their court bookings.</p></div>';\n\n  body += '<div class=\"field\"><label class=\"lb\">Invite Link</label>'+\n    '<input class=\"in num\" readonly value=\"'+esc(shareUrl)+'\" id=\"share-link-input\"></div>';\n\n  body += '<div class=\"stack\" style=\"margin-top:14px\">'+\n    '<button class=\"btn pri full\" data-a=\"copy-invite-link\">📋 Copy Invite Link</button>'+\n    '<button class=\"btn full teal\" data-a=\"share-book-whatsapp\">📲 Share on WhatsApp Group</button>'+\n    '</div>';\n\n  return sheetWrap(\"Invite &amp; Share Book\", body);\n}\n\nfunction typeSheet(){\n  var d = S.draft;\n  var body = '<div class=\"field\"><label class=\"lb\">Name</label><input class=\"in\" id=\"t-label\" placeholder=\"e.g. Shuttlecocks or Refreshments\" value=\"'+esc(d.label||\"\")+'\"></div>'+\n    '<div class=\"field\"><label class=\"lb\">Icon</label><div class=\"chips\">'+\n    [\"🏟️\",\"🟡\",\"🏸\",\"🏓\",\"🎾\",\"🥤\",\"🚗\",\"🧃\",\"👕\",\"🏆\",\"🧴\",\"💡\"].map(function(e){\n      return '<button class=\"chip '+(d.emoji===e?\"on\":\"\")+'\" data-a=\"temoji\" data-id=\"'+e+'\" style=\"font-size:16px\">'+e+'</button>';\n    }).join(\"\")+'</div></div>'+\n    '<button class=\"btn pri full\" style=\"margin-top:16px\" data-a=\"savetype\">Add Activity Type</button>';\n  return sheetWrap(\"New Activity Type\", body);\n}\n\nfunction menuSheet(){\n  var book = activeBook();\n  var body = '<div class=\"stack\">'+\n    '<button class=\"btn full\" data-a=\"roles-sheet\">👑 View Roles &amp; Permissions</button>'+\n    '<button class=\"btn full\" data-a=\"share-book-whatsapp\">📲 WhatsApp Dues Summary</button>'+\n    '<button class=\"btn full\" data-a=\"share-invite\">🔗 Share Book Invite Link</button>'+\n    '<button class=\"btn full\" data-a=\"books-sheet\">📚 Switch or Create Book</button>'+\n    '<button class=\"btn full\" data-a=\"allbooks-view\">🌐 Global All-Books Ledger</button>'+\n    '<div class=\"two\"><button class=\"btn\" data-a=\"export\">Export Backup</button><button class=\"btn\" data-a=\"import\">Import Backup</button></div>'+\n    (book && (!book.activities || !book.activities.length) ? '<button class=\"btn full\" data-a=\"demo\">Load Sample Data</button>' : '')+\n    (canDeleteBook(book) ? '<button class=\"btn full danger\" data-a=\"reset-book\">Reset Current Book</button>' : '')+'</div>';\n  return sheetWrap(\"Court Ledger Menu\", body);\n}\n\nfunction renderSheet(){\n  if(!S.sheet) return \"\";\n  if(S.sheet===\"activity\") return activitySheet();\n  if(S.sheet===\"payment\") return paymentSheet();\n  if(S.sheet===\"person\") return personSheet();\n  if(S.sheet===\"edit-profile\") return editProfileSheet();\n  if(S.sheet===\"qrview\") return qrViewSheet();\n  if(S.sheet===\"roles-info\") return rolesSheet();\n  if(S.sheet===\"type\") return typeSheet();\n  if(S.sheet===\"people\") return peopleSheet();\n  if(S.sheet===\"books\") return booksSheet();\n  if(S.sheet===\"create-book\") return createBookSheet();\n  if(S.sheet===\"invite\") return inviteSheet();\n  if(S.sheet===\"menu\") return menuSheet();\n  return \"\";\n}\n\n/* ───────── SHELL RENDER ───────── */\nvar ICONS = {\n  home: '<svg viewBox=\"0 0 24 24\"><path d=\"M3 10.5 12 3l9 7.5\"/><path d=\"M5 9.5V21h14V9.5\"/></svg>',\n  list: '<svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"17\" rx=\"2\"/><path d=\"M8 2v4M16 2v4M3 10h18\"/></svg>',\n  bal:  '<svg viewBox=\"0 0 24 24\"><path d=\"M12 3v18\"/><path d=\"M5 7h14\"/><path d=\"M5 7 2 14h6L5 7z\"/><path d=\"M19 7l-3 7h6l-3-7z\"/></svg>',\n  ppl:  '<svg viewBox=\"0 0 24 24\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>'\n};\nvar TABS = [[\"home\",\"Home\",\"home\"],[\"activities\",\"Log\",\"list\"],[\"balances\",\"Balances\",\"bal\"],[\"people\",\"Members\",\"ppl\"]];\n\nfunction render(){\n  var y = window.scrollY;\n  var book = activeBook();\n  var body = \"\";\n\n  if(S.view===\"allbooks\") body = viewAllBooks();\n  else if(S.view===\"home\") body = viewHome();\n  else if(S.view===\"activities\") body = viewActivities();\n  else if(S.view===\"balances\") body = viewBalances();\n  else body = viewPeople();\n\n  var me = book && book.meId ? bPerson(book, book.meId) : null;\n  var notifCount = getPendingNotifications(book).length;\n\n  $(\"#app\").innerHTML =\n    '<header class=\"top\"><div class=\"top-in\">'+\n      '<button class=\"book-trigger\" data-a=\"books-sheet\" title=\"Switch Book\">'+\n        '<span class=\"em\">'+(book ? (book.emoji||\"🏸\") : \"🏸\")+'</span>'+\n        '<span class=\"trunc\">'+esc(book ? book.name : \"Court Ledger\")+'</span>'+\n        '<span style=\"font-size:10px;color:var(--dim)\">▼</span>'+\n      '</button>'+\n      (me ? '<button class=\"me-chip\" data-a=\"person\" data-id=\"'+me.id+'\">'+av(book, me.id,\"sm\")+'<span>'+esc(me.name.split(\" \")[0])+'</span></button>' : '')+\n      '<button class=\"icon-btn\" data-a=\"roles-sheet\" title=\"View Roles & Permissions\" aria-label=\"Roles\">👑</button>'+\n      '<button class=\"icon-btn\" data-a=\"toggle-theme\" title=\"Toggle Light/Dark Mode\" aria-label=\"Toggle Theme\">'+(DB.theme===\"light\"?\"🌙\":\"☀️\")+'</button>'+\n      '<button class=\"icon-btn\" data-a=\"menu\" aria-label=\"Menu\">⋯'+(notifCount?'<span class=\"notif-badge\">'+notifCount+'</span>':'')+'</button>'+\n    '</div>'+\n    (me ? '<div class=\"role-bar\"><span>Active: <b>'+esc(me.name)+'</b></span><span class=\"role-badge '+(me.role||\"data_operator\")+'\">'+(ROLES[me.role||\"data_operator\"].label)+'</span></div>' : '')+\n    '</header>'+\n    '<main class=\"wrap\">'+body+'</main>'+\n    (book && book.people && book.people.length && canAddEntries(book) ? '<button class=\"fab\" data-a=\"newact\" aria-label=\"Add entry\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/></svg></button>' : '')+\n    '<nav class=\"bot\"><div class=\"nav-in\">'+TABS.map(function(t){\n      return '<button class=\"'+(S.view===t[0]?\"on\":\"\")+'\" data-a=\"go\" data-id=\"'+t[0]+'\">'+ICONS[t[2]]+'<span>'+t[1]+'</span></button>';\n    }).join(\"\")+'</div></nav>'+\n    renderSheet();\n\n  window.scrollTo(0, y);\n}\n\n/* ───────── DRAFT SYNC ───────── */\nfunction syncDraft(){\n  if(!S.draft) return;\n  var g = function(id){ var e=document.getElementById(id); return e?e.value:undefined; };\n  if(S.sheet===\"activity\"){\n    var a = g(\"f-amount\");     if(a!==undefined) S.draft.amount = a;\n    var v = g(\"f-venue\");      if(v!==undefined) S.draft.venue = v;\n    var d = g(\"f-date\");       if(d!==undefined) S.draft.date = d;\n    var st = g(\"f-start-time\");if(st!==undefined) S.draft.startTime = st;\n    var et = g(\"f-end-time\");  if(et!==undefined) S.draft.endTime = et;\n    var n = g(\"f-note\");       if(n!==undefined) S.draft.note = n;\n  }\n  if(S.sheet===\"payment\"){\n    var pa = g(\"p-amount\"); if(pa!==undefined) S.draft.amount = pa;\n    var pd = g(\"p-date\");   if(pd!==undefined) S.draft.date = pd;\n    var pt = g(\"p-time\");   if(pt!==undefined) S.draft.time = pt;\n    var pn = g(\"p-note\");   if(pn!==undefined) S.draft.note = pn;\n  }\n  if(S.sheet===\"type\"){\n    var l = g(\"t-label\"); if(l!==undefined) S.draft.label = l;\n  }\n}\n\n/* ───────── ACTIONS & HELPERS ───────── */\nfunction addPersonToBook(book, name, mobile, upiId, role){\n  name = String(name||\"\").trim(); if(!name) return null;\n  var exists = (book.people||[]).filter(function(p){ return p.name.toLowerCase()===name.toLowerCase(); })[0];\n  if(exists){ toast(name+\" is already in this book\"); return exists; }\n  var isFirst = !book.people || !book.people.length;\n  var p = {\n    id: uid(\"p\"),\n    name: name,\n    mobile: mobile || \"\",\n    upiId: upiId || \"\",\n    qrImage: \"\",\n    role: role || (isFirst ? \"primary_admin\" : \"data_operator\"),\n    color: PALETTE[(book.people?book.people.length:0) % PALETTE.length]\n  };\n  if(!book.people) book.people = [];\n  book.people.push(p);\n  if(!book.meId) book.meId = p.id;\n  syncPersonToDirectory(p);\n  saveDB(); return p;\n}\n\nfunction openActivity(act){\n  var book = activeBook(); var np = nowParts();\n  S.draft = act ? {\n    id: act.id,\n    typeId: act.typeId,\n    payerId: act.payerId,\n    amount: String(act.amount),\n    date: act.date || (act.at||\"\").slice(0,10),\n    timeMode: act.timeMode || (act.startTime ? 'slot' : 'none'),\n    startTime: act.startTime || \"20:00\",\n    endTime: act.endTime || \"22:00\",\n    venue: act.venue || \"\",\n    note: act.note || \"\",\n    parts: act.parts.slice()\n  } : {\n    id: null,\n    typeId: (book.types&&book.types[0]) ? book.types[0].id : \"court\",\n    payerId: (book&&book.meId) || ((book&&book.people[0]) ? book.people[0].id : \"\"),\n    amount: \"\",\n    date: np.date,\n    timeMode: \"slot\",\n    startTime: \"20:00\",\n    endTime: \"22:00\",\n    venue: (book.activities && book.activities.length ? book.activities[book.activities.length-1].venue : \"\") || \"\",\n    note: \"\",\n    parts: (book&&book.meId) ? [book.meId] : ((book&&book.people[0]) ? [book.people[0].id] : [])\n  };\n  S.sheet = \"activity\"; render();\n}\n\nfunction openPayment(from, to, amount){\n  var book = activeBook(); var np = nowParts();\n  var suggested = Math.abs(calcNet(book, from, to));\n  S.draft = {\n    fromId: from,\n    toId: to,\n    amount: String(amount || (suggested/100) || \"\"),\n    paymentMode: \"UPI\",\n    date: np.date,\n    time: np.time,\n    note: \"\",\n    status: (book.meId === to ? \"confirmed\" : \"pending\")\n  };\n  S.sheet = \"payment\"; render();\n}\n\nfunction closeSheet(){ S.sheet = null; S.draft = null; S.searchQuery = \"\"; render(); }\n\nfunction formatWhatsAppSummary(book){\n  var lines = [\"🏸 *\" + book.name + \" — Balance Summary* (\" + fmtD(new Date().toISOString()) + \")\"];\n  lines.push(\"━━━━━━━━━━━━━━━━━━━\");\n  var ps = calcPairs(book).filter(function(p){ return p.net !== 0; });\n  if(!ps.length){\n    lines.push(\"🎉 All players are completely square
