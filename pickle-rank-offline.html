\"faisal@okhdfcbank\", qrImage: \"\", role: \"primary_admin\", color: PALETTE[0] },\n      { id: \"p_hamid\",  name: \"Hamid Shaikh\", mobile: \"9898877665\", upiId: \"hamid@icici\", qrImage: \"\", role: \"book_admin\", color: PALETTE[1] },\n      { id: \"p_sumeet\", name: \"Sumeet Shetty\", mobile: \"9820011223\", upiId: \"sumeet@oksbi\", qrImage: \"\", role: \"data_operator\", color: PALETTE[2] },\n      { id: \"p_rohan\",  name: \"Rohan Verma\", mobile: \"9833344556\", upiId: \"rohan@paytm\", qrImage: \"\", role: \"viewer\", color: PALETTE[3] }\n    ],\n    activities: [\n      {\n        id: \"act_1\",\n        typeId: \"court\",\n        payerId: \"p_faisal\",\n        amount: 2400,\n        date: \"2026-08-27\",\n        timeMode: \"slot\",\n        startTime: \"20:00\",\n        endTime: \"22:00\",\n        slotText: \"8:00 PM – 10:00 PM (2 hrs)\",\n        venue: \"ASC Sports Club, Andheri\",\n        note: \"2 Courts booked by Faisal\",\n        parts: [\"p_faisal\", \"p_sumeet\", \"p_rohan\"]\n      },\n      {\n        id: \"act_2\",\n        typeId: \"court\",\n        payerId: \"p_sumeet\",\n        amount: 2400,\n        date: \"2026-08-27\",\n        timeMode: \"slot\",\n        startTime: \"06:00\",\n        endTime: \"08:00\",\n        slotText: \"6:00 AM – 8:00 AM (2 hrs)\",\n        venue: \"ASC Sports Club, Andheri\",\n        note: \"Morning slot by Sumeet — Offsets debt with Faisal to ₹0!\",\n        parts: [\"p_sumeet\", \"p_faisal\", \"p_rohan\"]\n      }\n    ],\n    payments: []\n  };\n\n  DB.books = [sampleBook];\n  DB.activeBookId = sampleBook.id;\n  sampleBook.people.forEach(syncPersonToDirectory);\n  saveDB();\n  toast(\"Sample book loaded with Primary Admin, Book Admin, Data Operator & Viewer!\");\n}\n\n/* ───────── EVENT DISPATCHER ───────── */\ndocument.addEventListener(\"click\", function(e){\n  var el = e.target.closest(\"[data-a]\"); if(!el) return;\n  var a = el.getAttribute(\"data-a\"), id = el.getAttribute(\"data-id\"), id2 = el.getAttribute(\"data-id2\");\n  if (a===\"closeovl\" && e.target !== el) return;\n\n  var book = activeBook();\n\n  switch(a){\n    case \"go\": S.view = id; S.sheet = null; render(); break;\n    case \"allbooks-view\": S.view = \"allbooks\"; S.sheet = null; render(); break;\n    case \"toggle-theme\": applyTheme(DB.theme===\"light\"?\"dark\":\"light\"); render(); break;\n    case \"menu\": S.sheet = \"menu\"; render(); break;\n    case \"roles-sheet\": S.sheet = \"roles-info\"; render(); break;\n    case \"role-tab\": S.roleInfoTab = id; render(); break;\n    case \"closesheet\": case \"closeovl\": closeSheet(); break;\n    case \"expand\": S.open[id] = !S.open[id]; render(); break;\n    case \"balmode\": S.balMode = id; render(); break;\n    case \"setme\": if(book){ book.meId = id; saveDB(); S.sheet = null; render(); toast(\"Switched to: \"+bPName(book, id)+\" (\"+ROLES[bPRole(book, id)].label+\")\"); } break;\n    case \"people-sheet\": S.sheet = \"people\"; S.searchQuery = \"\"; render(); break;\n    case \"books-sheet\": S.sheet = \"books\"; render(); break;\n    case \"create-book\": S.sheet = \"create-book\"; render(); break;\n    case \"switchbook\": DB.activeBookId = id; saveDB(); S.sheet = null; S.view = \"home\"; render(); toast(\"Switched book\"); break;\n    case \"share-invite\": S.sheet = \"invite\"; render(); break;\n    case \"demo\": loadSampleData(); S.sheet = null; S.view = \"home\"; render(); break;\n\n    case \"copy-upi\": {\n      var upiVal = el.getAttribute(\"data-upi\");\n      if(upiVal && navigator.clipboard){\n        navigator.clipboard.writeText(upiVal).then(function(){ toast(\"UPI ID copied: \"+upiVal); });\n      } else { prompt(\"UPI ID:\", upiVal); }\n      break;\n    }\n    case \"copy-invite-link\": {\n      var inp = document.getElementById(\"share-link-input\");\n      if(inp && navigator.clipboard){\n        navigator.clipboard.writeText(inp.value).then(function(){ toast(\"Invite link copied to clipboard!\"); });\n      }\n      break;\n    }\n    case \"share-book-whatsapp\": {\n      if(!book) break;\n      var text = formatWhatsAppSummary(book);\n      var waUrl = \"https://api.whatsapp.com/send?text=\" + encodeURIComponent(text);\n      window.open(waUrl, \"_blank\");\n      break;\n    }\n    case \"show-qr\": S.qrTargetPersonId = id; S.sheet = \"qrview\"; render(); break;\n\n    /* People & Roles */\n    case \"pick-suggest\": {\n      var sName = el.getAttribute(\"data-name\");\n      var sMob = el.getAttribute(\"data-mobile\");\n      var sUpi = el.getAttribute(\"data-upi\");\n      addPersonToBook(book, sName, sMob, sUpi, S._newMemberRole || \"data_operator\");\n      closeSheet(); render(); toast(sName+\" added from directory!\");\n      break;\n    }\n    case \"newp-role\": {\n      S._newMemberRole = id;\n      document.querySelectorAll(\"[data-a='newp-role']\").forEach(function(b){ b.classList.remove(\"on\"); });\n      el.classList.add(\"on\");\n      break;\n    }\n    case \"add-new-member\": {\n      var inpName = document.getElementById(\"newp-input\");\n      var inpMob = document.getElementById(\"newp-mobile\");\n      var inpUpi = document.getElementById(\"newp-upi\");\n      var nm = inpName ? inpName.value.trim() : \"\";\n      if(!nm){ toast(\"Please enter member name\"); break; }\n      addPersonToBook(book, nm, inpMob ? inpMob.value.trim() : \"\", inpUpi ? inpUpi.value.trim() : \"\", S._newMemberRole || \"data_operator\");\n      closeSheet(); render(); toast(nm+\" added as \"+ROLES[S._newMemberRole||\"data_operator\"].label);\n      break;\n    }\n    case \"person\": S.draft = { id: id }; S.sheet = \"person\"; render(); break;\n    case \"edit-profile\": S.draft = { id: id }; S.sheet = \"edit-profile\"; render(); break;\n    case \"edit-member-role\": S.draft = { id: id }; S.sheet = \"edit-profile\"; render(); break;\n    case \"set-member-role\": {\n      var pT = bPerson(book, S.draft.id);\n      if(pT){ pT.role = id; saveDB(); render(); toast(\"Role updated to \"+ROLES[id].label); }\n      break;\n    }\n    case \"save-profile\": {\n      var pTarget = bPerson(book, id);\n      if(pTarget){\n        var epName = document.getElementById(\"ep-name\");\n        var epMobile = document.getElementById(\"ep-mobile\");\n        var epUpi = document.getElementById(\"ep-upi\");\n        if(epName && epName.value.trim()) pTarget.name = epName.value.trim();\n        if(epMobile) pTarget.mobile = epMobile.value.trim();\n        if(epUpi) pTarget.upiId = epUpi.value.trim();\n        syncPersonToDirectory(pTarget);\n        saveDB(); S.sheet = \"person\"; S.draft = { id: id }; render(); toast(\"Profile updated\");\n      }\n      break;\n    }\n    case \"upload-qr\": S._qrTargetForUpload = S.draft.id; document.getElementById(\"qr-file-input\").click(); break;\n    case \"remove-qr\": {\n      var pQr = bPerson(book, S.draft.id);\n      if(pQr){ pQr.qrImage = \"\"; saveDB(); render(); toast(\"QR Image removed\"); }\n      break;\n    }\n    case \"delp\": {\n      if(!canManageBookSettings(book)){ toast(\"Only Admins can remove members\"); break; }\n      var used = (book.activities||[]).some(function(x){ return x.payerId===id || x.parts.indexOf(id)>=0; }) ||\n                 (book.payments||[]).some(function(x){ return x.fromId===id || x.toId===id; });\n      if(used){ toast(\"Cannot remove — member has existing transactions\"); break; }\n      book.people = book.people.filter(function(x){ return x.id!==id; });\n      if(book.meId===id) book.meId = null;\n      saveDB(); closeSheet(); break;\n    }\n\n    /* Activities */\n    case \"newact\":\n      if(!canAddEntries(book)){ toast(\"You have Viewer role (Read-only)\"); break; }\n      if(!book.people || !book.people.length){ S.sheet = \"people\"; render(); break; }\n      openActivity(null); break;\n    case \"editact\": {\n      var act = (book.activities||[]).filter(function(x){ return x.id===id; })[0];\n      if(act){\n        if(!canEditEntry(book, act)){ toast(\"You can only edit your own entries\"); break; }\n        openActivity(act);\n      }\n      break;\n    }\n    case \"delact\": {\n      var actD = (book.activities||[]).filter(function(x){ return x.id===id; })[0];\n      if(actD && !canDeleteEntry(book, actD)){ toast(\"You can only delete your own entries\"); break; }\n      if(confirm(\"Delete this court booking? Balances will recalculate.\")){\n        book.activities = book.activities.filter(function(x){ return x.id!==id; });\n        saveDB(); render(); toast(\"Booking deleted\");\n      }\n      break;\n    }\n    case \"dtype\": syncDraft(); S.draft.typeId = id; render(); break;\n    case \"dpayer\": syncDraft(); S.draft.payerId = id; if(S.draft.parts.indexOf(id)<0) S.draft.parts.push(id); render(); break;\n    case \"dpart\": {\n      syncDraft(); var idx = S.draft.parts.indexOf(id);\n      if(idx>=0) S.draft.parts.splice(idx, 1); else S.draft.parts.push(id);\n      render(); break;\n    }\n    case \"dall\": {\n      syncDraft();\n      S.draft.parts = (S.draft.parts.length === book.people.length) ? [] : book.people.map(function(p){ return p.id; });\n      render(); break;\n    }\n    case \"dtime-mode\": syncDraft(); S.draft.timeMode = id; render(); break;\n    case \"set-dur\": {\n      syncDraft();\n      var stVal = S.draft.startTime || \"20:00\";\n      var pT = stVal.split(\":\"); var hStart = parseInt(pT[0],10), mStart = parseInt(pT[1],10);\n      var addMin = id==='1 hr'?60:(id==='1.5 hrs'?90:(id==='2 hrs'?120:180));\n      var totalMin = (hStart*60 + mStart + addMin) % 1440;\n      var hEnd = Math.floor(totalMin/60), mEnd = totalMin%60;\n      S.draft.endTime = pad(hEnd)+\":\"+pad(mEnd);\n      render(); break;\n    }\n    case \"saveact\": {\n      syncDraft(); var d = S.draft;\n      if(!(Number(d.amount)>0)){ toast(\"Please enter the total court amount\"); break; }\n      if(!d.payerId){ toast(\"Who paid for this booking?\"); break; }\n      if(!d.parts.length){ toast(\"Select at least one player\"); break; }\n\n      var slotText = \"\";\n      if(d.timeMode==='slot' && d.startTime){\n        slotText = fmtTime(d.startTime) + (d.endTime ? \" – \" + fmtTime(d.endTime) : \"\");\n      }\n\n      var rec = {\n        id: d.id || uid(\"act\"),\n        typeId: d.typeId,\n        payerId: d.payerId,\n        amount: Number(d.amount),\n        date: d.date || nowParts().date,\n        timeMode: d.timeMode,\n        startTime: d.startTime,\n        endTime: d.endTime,\n        slotText: slotText,\n        venue: (d.venue||\"\").trim(),\n        note: (d.note||\"\").trim(),\n        parts: d.parts.slice()\n      };\n\n      if(!book.activities) book.activities = [];\n      if(d.id) book.activities = book.activities.map(function(x){ return x.id===d.id ? rec : x; });\n      else book.activities.push(rec);\n\n      saveDB(); closeSheet();\n      toast(d.id ? \"Booking updated\" : \"Logged — split across \"+rec.parts.length+\" players!\");\n      break;\n    }\n\n    /* Payments & Two-Party Acknowledgment */\n    case \"pay\": openPayment(id, id2); break;\n    case \"pmode\": syncDraft(); S.draft.paymentMode = id; render(); break;\n    case \"savepay\": {\n      syncDraft(); var pd = S.draft;\n      if(!(Number(pd.amount)>0)){ toast(\"Enter the payment amount\"); break; }\n      if(!book.payments) book.payments = [];\n      var isAutoConfirm = (book.meId === pd.toId);\n      book.payments.push({\n        id: uid(\"pay\"),\n        fromId: pd.fromId,\n        toId: pd.toId,\n        amount: Number(pd.amount),\n        paymentMode: pd.paymentMode || \"UPI\",\n        date: pd.date || nowParts().date,\n        time: pd.time || nowParts().time,\n        note: (pd.note||\"\").trim(),\n        status: isAutoConfirm ? \"confirmed\" : \"pending\"\n      });\n      saveDB(); closeSheet();\n      toast(isAutoConfirm ? \"Payment cleared immediately\" : \"Payment marked as paid! Waiting for \"+bPName(book, pd.toId)+\" to acknowledge.\");\n      break;\n    }\n    case \"confirmpay\": {\n      var pay = (book.payments||[]).filter(function(x){ return x.id===id; })[0];\n      if(pay){\n        pay.status = \"confirmed\";\n        saveDB(); render();\n        toast(\"✅ Payment acknowledged and received! Dues settled.\");\n      }\n      break;\n    }\n    case \"delpay\": {\n      if(confirm(\"Cancel / Remove this payment entry?\")){\n        book.payments = book.payments.filter(function(x){ return x.id!==id; });\n        saveDB(); render();\n      }\n      break;\n    }\n\n    /* New Book & Types */\n    case \"save-new-book\": {\n      var nbName = document.getElementById(\"nb-name\");\n      var nmVal = nbName ? nbName.value.trim() : \"\";\n      if(!nmVal){ toast(\"Please give your book a name\"); break; }\n      var myProf = (book && book.meId) ? bPerson(book, book.meId) : null;\n      var creatorPerson = {\n        id: uid(\"p\"),\n        name: myProf ? myProf.name : \"You\",\n        mobile: myProf ? myProf.mobile : \"\",\n        upiId: myProf ? myProf.upiId : \"\",\n        qrImage: myProf ? myProf.qrImage : \"\",\n        role: \"primary_admin\",\n        color: PALETTE[0]\n      };\n      var newB = {\n        id: uid(\"b\"),\n        name: nmVal,\n        emoji: S._newBookEmoji || \"🏸\",\n        createdAt: new Date().toISOString(),\n        meId: creatorPerson.id,\n        types: [\n          { id: \"court\", label: \"Court booking\", emoji: \"🏟️\" },\n          { id: \"balls\", label: \"Balls / Shuttles\", emoji: \"🟡\" }\n        ],\n        people: [creatorPerson],\n        activities: [],\n        payments: []\n      };\n      DB.books.push(newB);\n      DB.activeBookId = newB.id;\n      syncPersonToDirectory(creatorPerson);\n      saveDB(); closeSheet(); S.view = \"people\"; render();\n      toast(\"Book '\"+nmVal+\"' created with you as Primary Admin!\");\n      break;\n    }\n    case \"nb-emoji\": {\n      S._newBookEmoji = id;\n      document.querySelectorAll(\"[data-a='nb-emoji']\").forEach(function(b){ b.classList.remove(\"on\"); });\n      el.classList.add(\"on\");\n      break;\n    }\n    case \"newtype\": syncDraft(); S.draft = { label:\"\", emoji:\"🏟️\" }; S.sheet = \"type\"; render(); break;\n    case \"temoji\": syncDraft(); S.draft.emoji = id; render(); break;\n    case \"savetype\": {\n      syncDraft(); var lab = (S.draft.label||\"\").trim();\n      if(!lab){ toast(\"Enter activity label\"); break; }\n      if(!book.types) book.types = [];\n      book.types.push({ id: uid(\"t\"), label: lab, emoji: S.draft.emoji||\"🏟️\" });\n      saveDB(); S.sheet = null; render(); toast(lab+\" added\"); break;\n    }\n    case \"deltype\": {\n      book.types = (book.types||[]).filter(function(t){ return t.id!==id; });\n      saveDB(); render(); break;\n    }\n\n    /* Reset & Backup */\n    case \"reset-book\": {\n      if(!canDeleteBook(book)){ toast(\"Only Primary Admin can reset the book\"); break; }\n      if(confirm(\"Erase all bookings and payments in '\"+book.name+\"'?\")){\n        book.activities = []; book.payments = [];\n        saveDB(); S.sheet = null; S.view = \"home\"; render(); toast(\"Book transactions reset\");\n      }\n      break;\n    }\n    case \"export\": {\n      var blob = new Blob([JSON.stringify(DB, null, 2)], { type: \"application/json\" });\n      var url = URL.createObjectURL(blob); var link = document.createElement(\"a\");\n      link.href = url; link.download = \"court-ledger-backup-\" + nowParts().date + \".json\"; link.click();\n      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);\n      toast(\"Backup downloaded\"); break;\n    }\n    case \"import\": document.getElementById(\"importer\").click(); break;\n  }\n});\n\n/* Inputs & Hotkeys */\ndocument.addEventListener(\"keydown\", function(e){\n  if(e.key===\"Escape\" && S.sheet) closeSheet();\n});\ndocument.addEventListener(\"input\", function(e){\n  var t = e.target;\n  if(t && t.id===\"f-amount\"){ if(S.draft) S.draft.amount = t.value; refreshPreview(); }\n  if(t && t.id===\"newp-input\"){\n    S.searchQuery = t.value;\n    var book = activeBook();\n    var q = t.value.toLowerCase().trim();\n    var suggestions = (DB.globalDirectory||[]).filter(function(g){\n      var alreadyIn = (book.people||[]).some(function(p){ return p.name.toLowerCase() === g.name.toLowerCase(); });\n      if(alreadyIn) return false;\n      return !q || g.name.toLowerCase().indexOf(q) >= 0 || (g.mobile && g.mobile.indexOf(q) >= 0);\n    });\n    var box = document.querySelector(\".suggest-box\");\n    if(!box && suggestions.length){ render(); }\n    else if(box){\n      box.innerHTML = suggestions.slice(0,5).map(function(sug){\n        return '<div class=\"suggest-item\" data-a=\"pick-suggest\" data-name=\"'+esc(sug.name)+'\" data-mobile=\"'+esc(sug.mobile)+'\" data-upi=\"'+esc(sug.upiId)+'\">'+\n          '<div class=\"av sm\" style=\"background:'+sug.color+'\">'+esc(initials(sug.name))+'</div>'+\n          '<div class=\"grow\"><div style=\"font-weight:700;font-size:12px\">'+esc(sug.name)+'</div>'+\n          '<div class=\"sub\">'+(sug.mobile?sug.mobile+\" · \":\"\")+(sug.upiId?'UPI: '+sug.upiId:'')+'</div></div>'+\n          '<button class=\"btn sm pri\">+ Add</button></div>';\n      }).join(\"\");\n    }\n  }\n});\n\n/* QR Code Image Upload & Compression via Canvas */\ndocument.getElementById(\"qr-file-input\").addEventListener(\"change\", function(e){\n  var file = e.target.files[0]; if(!file) return;\n  var reader = new FileReader();\n  reader.onload = function(evt){\n    var img = new Image();\n    img.onload = function(){\n      var canvas = document.createElement(\"canvas\");\n      var maxDim = 400;\n      var w = img.width, h = img.height;\n      if(w > maxDim || h > maxDim){\n        if(w > h){ h = Math.round((h * maxDim)/w); w = maxDim; }\n        else { w = Math.round((w * maxDim)/h); h = maxDim; }\n      }\n      canvas.width = w; canvas.height = h;\n      var ctx = canvas.getContext(\"2d\");\n      ctx.drawImage(img, 0, 0, w, h);\n      var compressedData = canvas.toDataURL(\"image/jpeg\", 0.85);\n\n      var book = activeBook();\n      var pTarget = bPerson(book, S._qrTargetForUpload);\n      if(pTarget){\n        pTarget.qrImage = compressedData;\n        syncPersonToDirectory(pTarget);\n        saveDB(); render(); toast(\"QR Scanner image uploaded!\");\n      }\n    };\n    img.src = evt.target.result;\n  };\n  reader.readAsDataURL(file);\n  e.target.value = \"\";\n});\n\n/* Import Backup */\ndocument.getElementById(\"importer\").addEventListener(\"change\", function(e){\n  var f = e.target.files[0]; if(!f) return;\n  var r = new FileReader();\n  r.onload = function(){\n    try {\n      var j = JSON.parse(r.result);\n      if(j.books && Array.isArray(j.books)){\n        DB = j;\n      }\n      saveDB(); applyTheme(DB.theme); S.sheet = null; S.view = \"home\"; render();\n      toast(\"Backup successfully restored!\");\n    } catch(err){ toast(\"Invalid backup file\"); }\n  };\n  r.readAsText(f); e.target.value = \"\";\n});\n\n/* ───────── INITIALIZATION ───────── */\nfunction init(){\n  var saved = Store.load();\n  if(saved && saved.books && saved.books.length){\n    DB = saved;\n  } else {\n    loadSampleData();\n  }\n\n  // Ensure global directory is populated\n  if(!DB.globalDirectory) DB.globalDirectory = [];\n  DB.books.forEach(function(b){\n    (b.people||[]).forEach(syncPersonToDirectory);\n  });\n\n  applyTheme(DB.theme || \"dark\");\n  render();\n}\n\ninit();\n\n})();\n<\/script>\n</body>\n</html>\n";</script>

    /* Register the service worker only when served over http(s). file:// has
       no service-worker support, and an unguarded call throws there — which
       would break the offline single-file build this project is built around.
       Failure is swallowed: no service worker is a degraded PWA, not a broken app. */
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }

button:hover{filter:brightness(1.15);}
button:active{transform:scale(.965);}
input,select{transition:border-color .15s ease, box-shadow .15s ease;}
input:focus,select:focus{box-shadow:0 0 0 2px rgba(101,163,13,.3) !important;}
::selection{background:rgba(101,163,13,.25);}
*{scrollbar-width:thin;scrollbar-color:#94a3b8 transparent;}

::-webkit-scrollbar-track{background:transparent;}

<style>
/* ---------- print pack ----------
   After the OSL 2026 sheets. One page per group, carrying fixtures, standings
   and the score-margin grid, so a blank print-out is enough to run and settle
   a group by hand at the court. */
#printArea{display:none}
@media print{
  @page{size:A4;margin:11mm}
  body>#root{display:none!important}
  #printArea{display:block;font-family:'Sora',Arial,sans-serif;color:#111}
  #printArea .psheet{page-break-after:always}
  #printArea .psheet:last-child{page-break-after:auto}

  #printArea .brandbar{display:flex;align-items:flex-start;gap:13px;
    border-bottom:3px solid #111;padding-bottom:8px;margin-bottom:14px}
  #printArea .blogo{height:34px;width:auto;flex-shrink:0}
  #printArea .btitle{flex:1;min-width:0}
  #printArea .sport{font-size:27px;font-weight:900;letter-spacing:-.025em;
    text-transform:uppercase;line-height:.98}
  #printArea .meta{font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;
    color:#555;margin-top:5px;line-height:1.5}
  #printArea .printed{font-size:8.5px;color:#666;text-align:right;
    max-width:110px;line-height:1.5}

  #printArea .grp{font-size:14px;font-weight:900;text-transform:uppercase;
    letter-spacing:.01em;margin:16px 0 7px;padding-bottom:4px;border-bottom:2px solid #111}
  #printArea .sub{font-size:11px;font-weight:900;text-transform:uppercase;
    letter-spacing:.05em;margin:14px 0 5px;color:#111}
  #printArea .psheet>.sub:first-of-type{margin-top:4px}

  #printArea table{border-collapse:collapse;width:100%}
  #printArea th{border:1px solid #b7bfcc;background:#eef1f6;padding:5px 8px;
    font-size:8px;text-transform:uppercase;letter-spacing:.11em;
    text-align:left;color:#5b6982;font-weight:700}
  #printArea td{border:1px solid #b7bfcc;padding:7px 8px;font-size:11.5px}
  #printArea td.c{text-align:center}
  #printArea td.ct{font-size:10px;color:#555}
  #printArea td.b{font-weight:800}
  #printArea td.win{font-weight:800}
  #printArea td.sbox{font-weight:800;font-size:15px;height:26px}
  #printArea td.self{background:#dde3ec}
  #printArea td.nm{font-weight:700;font-size:10.5px}
  #printArea .qual{font-weight:400;color:#666;font-size:10px}
  #printArea .cap{font-size:8px;color:#666;margin:4px 0 0;line-height:1.5}
  #printArea .rules{font-size:8.5px;color:#444;margin-top:14px;
    border-top:1px solid #c4ccd8;padding-top:6px;line-height:1.55}
  #printArea .mg th{font-size:7.5px;font-weight:600}
  #printArea .mg td{font-size:10px;padding:6px 4px}
  #printArea .fx td{padding:8px}
}
</style>

    <script>/* ---------- storage keys ----------
   Every localStorage key flows through lsKey(). The prefix changed from the old
   Pickle Rank "pr9_" to "rs_" at the RISE Sports rebrand, so migrate() copies
   the old keys across once and a returning browser keeps its data. It only
   ever writes when the new key is absent, and never deletes the old one, so
   running it twice is harmless. Safe to drop a release or two from now.

   NAMING: this helper must not be a single letter. It was called `K` briefly,
   which collided with the minified single-letter locals this file uses — the
   root component binds `K` as setCommunityGames (see RiseSports), so every
   load and every save silently went to a key named "undefined". Keep the name
   long enough that no local can shadow it. */
const PREFIX = "rs_", lsKey = n => PREFIX + n;
(function migrateLegacyKeys() {
  try {
    /* Builds between the rebrand and this fix wrote every store to a key
       literally named "undefined". Harmless but confusing; clear it out. */
    localStorage.getItem("undefined") !== null && localStorage.removeItem("undefined");
    if (localStorage.getItem(lsKey("migrated"))) return;
    [
      "pl",
      "u",
      "t",
      "c",
      "r",
      "cg",
      "venues"
    ].forEach(n => {
      const old = localStorage.getItem("pr9_" + n);
      old !== null && localStorage.getItem(lsKey(n)) === null && localStorage.setItem(lsKey(n), old);
    });
    localStorage.setItem(lsKey("migrated"), "1");
  } catch (e) {
  }
})();
/* ---------- sports ----------
   Everything sport-specific lives here. The app was pickleball-only until the
   RISE Sports rebrand, so `DEFAULT_SPORT` is pickleball and every record
   without a `sport` field is treated as pickleball — see sportOf().

   scoring/serveModel feed the referee console. Tennis and padel are scored by
   games and sets rather than a point target, so they carry setBased:true and
   scoring:null; the point-based console does not cover them yet.

   Rating keys are namespaced by sport — "pb:md", not "md" — so a badminton

/* ---------- print pack ----------
   Laid out after the OSL 2026 sheets.

   ONE PAGE PER GROUP, carrying everything an organiser needs at the court:
   the fixtures, the standings table, and the score-margin grid. Printed blank
   before play, the scores get written on by hand and the two grids below give
   somewhere to work them out — which is the whole reason paper still beats a
   phone on a windy court.

   Two things I had wrong before and OSL gets right: matches are ROWS IN ONE
   TABLE, not a table each, and the explanatory caption appears ONCE under the
   table rather than repeating under every match.

   Built into a hidden #printArea then window.print(), never window.open —
   popups are blocked on the phones organisers actually carry. */
const printEsc = s => String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

const printHead = (tourney, title, sub) => {
  const sp = sportOf(tourney.sport);
  const meta = (sub || [
    tourney.name,
    tourney.startTime,
    tourney.numCourts ? `${ tourney.numCourts } courts` : null
  ].filter(Boolean).join(" · ")).toUpperCase();
  const logo = brandLogo();
  return `<div class="brandbar">
      ${ logo ? `<img class="blogo" src="${ logo }" alt="RISE Sports">` : "" }
      <div class="btitle">
        <div class="sport">${ printEsc(sp.name) }${ title ? ` &mdash; ${ printEsc(title) }` : "" }</div>
        <div class="meta">${ printEsc(meta) }</div>
      </div>
      <div class="printed">Printed ${ printEsc(new Date().toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }).replace(",", " ·")) }</div>
    </div>`;
};

/* Matches as rows in ONE table. Court, then the two teams either side of their
   score boxes, winner in bold. Blank boxes when printing before play. */
const fixtureTable = (matches, withData) => {
  if (!matches.length) return "";
  return `<table class="fx">
      <tr><th class="c" style="width:42px">Court</th><th>Team</th>
          <th class="c" style="width:50px">Score</th><th class="c" style="width:50px">Score</th><th>Team</th></tr>
      ${ matches.map(mt => {
        const a = mt.teamA || mt.p1, b = mt.teamB || mt.p2;
        const sa = mt.scoreA != null ? mt.scoreA : mt.s1, sb = mt.scoreB != null ? mt.scoreB : mt.s2;
        const played = withData && mt.played && sa != null && sb != null;
        return `<tr>
          <td class="c ct">${ printEsc(mt.court || "") }</td>
          <td class="${ played && sa > sb ? "win" : "" }">${ printEsc(teamName(a) || "TBD") }</td>
          <td class="c sbox">${ played ? printEsc(sa) : "" }</td>
          <td class="c sbox">${ played ? printEsc(sb) : "" }</td>
          <td class="${ played && sb > sa ? "win" : "" }">${ printEsc(teamName(b) || "TBD") }</td>
        </tr>`;
      }).join("") }
    </table>
    <div class="cap">Left score box belongs to the team on the left, right box to the team on the right. The higher score wins &mdash; no separate winner column.</div>`;
};

/* The score-margin grid. Worth the space because the row total IS the point
   difference that separates teams level on wins — and printed blank it is
   somewhere to work the table out by hand. */
const marginGrid = (group, withData) => {
  const teams = group.teams || [];
  if (teams.length < 2) return "";
  const played = (group.matches || []).filter(m => m.played);
  const marginOf = (row, col) => {
    const m = played.find(x =>
      (x.teamA.id === row.id && x.teamB.id === col.id) ||
      (x.teamA.id === col.id && x.teamB.id === row.id));
    if (!m || !withData) return null;
    return m.teamA.id === row.id ? m.scoreA - m.scoreB : m.scoreB - m.scoreA;
  };
  const rows = teams.map(t => {
    const cells = teams.map(o => (o.id === t.id ? null : marginOf(t, o)));
    return { t, cells, wins: cells.filter(v => v != null && v > 0).length,
             diff: cells.reduce((s2, v) => s2 + (v || 0), 0) };
  });
  const ranked = [...rows].sort((a, b) => b.wins - a.wins || b.diff - a.diff);
  const needsH2H = r => ranked.some(o => o !== r && o.wins === r.wins && o.diff === r.diff);

  return `<div class="sub">Score margin</div>
    <table class="mg">
      <tr><th style="width:20%">Group ${ printEsc(group.label) }</th>
        ${ teams.map(t => `<th class="c">${ printEsc(teamName(t)) }</th>`).join("") }

const rulesLine = tourney => {
  const r = resolveRules(tourney.sport, { target: tourney.pointsToWin, ...tourney.scoring || {} });
  if (!r) return "";
  return `<div class="rules">One game to ${ r.target }.` +
    (r.sideOut ? " Service points — only the serving side scores." : " Rally scoring — every rally is a point.") +
    (r.winBy > 1 ? ` Won by ${ r.winBy } clear points.` : "") +
    (r.cap ? ` Golden point at ${ r.golden }–${ r.golden }, so no score passes ${ r.cap }.` : "") +

/* ONE PAGE PER GROUP: fixtures, then the margin grid.
   No standings table — the margin grid already carries wins, difference and
   rank, and it is the grid an organiser fills in by hand, so printing both was
   asking for two sets of numbers to disagree with each other. */
const groupSheet = (tourney, group, withData) =>
  `<div class="psheet">${
    printHead(tourney, `Group ${ group.label }`,
      [tourney.name, group.catName, group.court ? `Court ${ group.court }` : null].filter(Boolean).join(" · "))
  }<div class="sub">Fixtures</div>${
    fixtureTable(group.matches || [], withData)
  }${ marginGrid(group, withData) }${ rulesLine(tourney) }</div>`;

const bracketSheet = (tourney, withData) => {
  const kb = tourney.knockoutBrackets || {};
  const keys = Object.keys(kb).filter(k => (kb[k] || []).length);
  if (!keys.length) return "";
  let h = `<div class="psheet">${ printHead(tourney, "Knockout") }`;
  keys.forEach(k => {
    const cat = (tourney.categories || [])[k];
    const rounds = kb[k] || [];
    h += `<div class="grp">${ printEsc(cat ? cat.name : "Category " + k) }</div>`;
    rounds.forEach((round, ri) => {
      const names = ["Final", "Semi-finals", "Quarter-finals"];
      const label = names[rounds.length - 1 - ri] || `Round ${ ri + 1 }`;
      h += `<div class="sub">${ printEsc(label) }</div>` + fixtureTable(round, withData);
    });
  });
  return h + rulesLine(tourney) + `</div>`;
};

/* only: "fixtures" | "standings" | "bracket" | undefined for the whole book */
const printPack = (tourney, withData, only) => {
  const area = document.getElementById("printArea");
  if (!area) return;
  const groups = tourney.groups || [];
  let html = "";
  if (only === "bracket") html = bracketSheet(tourney, withData);
  else if (only === "standings") {
    /* standings-only: every group on one sheet, which is what gets pinned up */
    html = `<div class="psheet">${ printHead(tourney, "Score margin") }` +
      groups.map(g => marginGrid(g, withData)).join("") + rulesLine(tourney) + `</div>`;
  } else {
    html = groups.map(g => groupSheet(tourney, g, withData)).join("");
    if (only !== "fixtures") html += bracketSheet(tourney, withData);
  }
  if (!html) { alert("Nothing to print yet — create some groups first."); return; }
  area.innerHTML = html;
  window.print();
};
