<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#060a12"/>
<title>Court Ledger — Sports & Game Bookings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060a12;
  --surface: #0d1420;
  --card: #141e30;
  --card2: #1a2740;
  --card3: #243553;
  --line: #1f2e48;
  --line2: #2c3f62;
  --lime: #a3e635;
  --lime-dark: #65a30d;
  --teal: #2dd4bf;
  --blue: #38bdf8;
  --purple: #c084fc;
  --red: #fb7185;
  --gold: #fbbf24;
  --orange: #fb923c;
  --text: #eaf0f8;
  --text-heading: #ffffff;
  --muted: #8899b4;
  --dim: #566a86;
  --shadow: 0 10px 30px rgba(0, 0, 0, .4);
  --r: 14px;
  --hero-bg: linear-gradient(150deg, rgba(163,230,53,.09), rgba(45,212,191,.05));
  --hero-border: rgba(163,230,53,.18);
  --badge-admin: rgba(163, 230, 53, 0.15);
  --badge-admin-txt: #a3e635;
  --badge-op: rgba(56, 189, 248, 0.15);
  --badge-op-txt: #38bdf8;
  --badge-viewer: rgba(136, 153, 180, 0.15);
  --badge-viewer-txt: #8899b4;
}

[data-theme="light"] {
  --bg: #ffffff;
  --surface: #f8fafc;
  --card: #ffffff;
  --card2: #f1f5f9;
  --card3: #e2e8f0;
  --line: #e2e8f0;
  --line2: #cbd5e1;
  --lime: #16a34a;
  --lime-dark: #15803d;
  --teal: #0d9488;
  --blue: #0284c7;
  --purple: #9333ea;
  --red: #e11d48;
  --gold: #d97706;
  --orange: #ea580c;
  --text: #0f172a;
  --text-heading: #020617;
  --muted: #475569;
  --dim: #64748b;
  --shadow: 0 4px 20px -2px rgba(0, 0, 0, .06);
  --hero-bg: linear-gradient(150deg, rgba(22, 163, 74, .08), rgba(13, 148, 136, .05));
  --hero-border: rgba(22, 163, 74, .25);
  --badge-admin: rgba(22, 163, 74, 0.12);
  --badge-admin-txt: #16a34a;
  --badge-op: rgba(2, 132, 199, 0.12);
  --badge-op-txt: #0284c7;
  --badge-viewer: rgba(100, 116, 139, 0.12);
  --badge-viewer-txt: #475569;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Sora', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
  transition: background .2s ease, color .2s ease;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; border-radius: 6px; }
.num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

/* shell */
.wrap { max-width: 600px; margin: 0 auto; padding: 0 14px; }
header.top {
  position: sticky; top: 0; z-index: 60;
  background: var(--surface);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.top-in {
  max-width: 600px; margin: 0 auto; padding: 9px 14px;
  display: flex; align-items: center; gap: 8px;
}
.book-trigger {
  display: flex; align-items: center; gap: 8px;
  background: var(--card2); border: 1px solid var(--line);
  padding: 5px 10px 5px 6px; border-radius: 12px;
  font-weight: 700; font-size: 13px; color: var(--text-heading);
  max-width: 190px;
}
.book-trigger .em { font-size: 18px; }
.mark {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, var(--lime), var(--teal));
  display: grid; place-items: center; font-size: 16px; flex: 0 0 auto;
}
.me-chip {
  margin-left: auto; display: flex; align-items: center; gap: 6px;
  background: var(--card2); border: 1px solid var(--line);
  padding: 4px 9px 4px 4px; border-radius: 99px; font-size: 11px; font-weight: 600; color: var(--muted);
}
.icon-btn {
  width: 34px; height: 34px; border-radius: 10px;
  background: var(--card2); border: 1px solid var(--line);
  color: var(--text); display: grid; place-items: center; font-size: 15px;
  position: relative; transition: transform .1s ease, background .15s ease;
}
.icon-btn:hover { background: var(--card3); }
.icon-btn:active { transform: scale(0.95); }
.notif-badge {
  position: absolute; top: -3px; right: -3px; background: var(--red); color: #fff;
  border-radius: 99px; font-size: 9px; font-weight: 800; padding: 1px 5px; border: 2px solid var(--surface);
}

/* User Role Bar */
.role-bar {
  background: var(--card2); border-bottom: 1px solid var(--line);
  padding: 6px 14px; font-size: 11px; display: flex; align-items: center; justify-content: space-between;
}
.role-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px;
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
}
.role-badge.primary_admin, .role-badge.book_admin { background: var(--badge-admin); color: var(--badge-admin-txt); }
.role-badge.data_operator { background: var(--badge-op); color: var(--badge-op-txt); }
.role-badge.viewer { background: var(--badge-viewer); color: var(--badge-viewer-txt); }

main { padding-top: 16px; padding-bottom: 116px; }

/* type */
h2.sec {
  font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--dim); margin: 22px 0 10px; display: flex; align-items: center; justify-content: space-between;
}
h2.sec:first-child { margin-top: 0; }
.sub { font-size: 11px; color: var(--dim); }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 8px; }

/* avatar */
.av {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  font-size: 11px; font-weight: 800; color: #060a12; flex: 0 0 auto;
}
.av.sm { width: 24px; height: 24px; font-size: 9px; font-weight: 700; }
.av.lg { width: 48px; height: 48px; font-size: 18px; }
.avstack { display: flex; }
.avstack .av { margin-left: -8px; box-shadow: 0 0 0 2px var(--card); }
.avstack .av:first-child { margin-left: 0; }

/* hero */
.hero {
  background: var(--hero-bg); border: 1px solid var(--hero-border);
  border-radius: 20px; padding: 18px; box-shadow: var(--shadow);
}
.hero .eyebrow { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--lime); font-weight: 700; }
.hero .big { font-size: 34px; font-weight: 800; line-height: 1.08; margin-top: 6px; letter-spacing: -.03em; }
.hero .note { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.45; }
.split2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.mini { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.mini b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
.mini span { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-top: 2px; }

/* Notification Banner */
.notif-banner {
  background: rgba(251, 191, 36, 0.12); border: 1px solid rgba(251, 191, 36, 0.35);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
}
.notif-banner.success {
  background: rgba(45, 212, 191, 0.1); border-color: rgba(45, 212, 191, 0.3); color: var(--teal);
}

/* Netting strip */
.net { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.net + .net { margin-top: 9px; }
.net-head { display: flex; align-items: center; gap: 9px; padding: 12px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.net-legs { padding: 11px 14px; display: flex; flex-direction: column; gap: 6px; }
.leg { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.leg .bar { height: 5px; border-radius: 3px; flex: 0 0 auto; }
.leg .bar.a { background: linear-gradient(90deg, rgba(45,212,191,.4), var(--teal)); }
.leg .bar.b { background: linear-gradient(90deg, rgba(251,113,133,.4), var(--red)); }
.leg .lv { margin-left: auto; font-weight: 700; color: var(--text); }
.net-out { display: flex; align-items: center; gap: 9px; padding: 11px 14px; border-top: 1px dashed var(--line2); background: var(--card2); }
.net-out .res { font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
.settled { font-size: 11px; color: var(--dim); padding: 10px 14px; border-top: 1px dashed var(--line2); }

/* pills / chips */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.chip {
  padding: 7px 13px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--card2); color: var(--muted); font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; transition: all .15s ease;
}
.chip.on { border-color: var(--lime); background: rgba(163,230,53,.15); color: var(--lime); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 16px; border-radius: 11px; background: var(--card2); border: 1px solid var(--line);
  color: var(--text); font-weight: 700; font-size: 13px; transition: transform .1s ease, filter .15s ease;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: scale(0.98); }
.btn.pri { background: linear-gradient(135deg, var(--lime), var(--lime-dark)); color: #060a12; border: none; font-weight: 800; }
[data-theme="light"] .btn.pri { color: #ffffff; }
.btn.teal { background: linear-gradient(135deg, var(--teal), #0d9488); color: #052e2b; border: none; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { padding: 6px 11px; font-size: 11px; border-radius: 9px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.danger { color: var(--red); border-color: rgba(251,113,133,.3); background: rgba(251,113,133,.08); }

/* list rows */
.item {
  display: flex; align-items: center; gap: 11px; padding: 12px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  width: 100%; text-align: left; box-shadow: var(--shadow);
}
.item + .item { margin-top: 8px; }
.item .t { font-size: 13px; font-weight: 700; color: var(--text-heading); }
.item .s { font-size: 11px; color: var(--dim); margin-top: 2px; }
.amt { font-size: 15px; font-weight: 800; letter-spacing: -.02em; }

/* activity card */
.act { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.act + .act { margin-top: 9px; }
.act-top { display: flex; align-items: center; gap: 11px; padding: 12px 14px; width: 100%; text-align: left; }
.emo {
  width: 38px; height: 38px; border-radius: 11px; background: var(--card2);
  display: grid; place-items: center; font-size: 18px; flex: 0 0 auto;
}
.act-body { border-top: 1px solid var(--line); padding: 12px 14px; background: var(--card2); }
.brk { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; }
.brk + .brk { border-top: 1px solid var(--line); }

/* inputs */
label.lb {
  display: block; font-size: 10px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--dim); margin-bottom: 6px;
}
.in {
  width: 100%; padding: 11px 13px; background: var(--surface);
  border: 1px solid var(--line2); border-radius: 11px; color: var(--text);
  font-size: 14px; outline: none; transition: border-color .15s ease;
}
.in:focus { border-color: var(--lime); }
.in.big { font-size: 26px; font-weight: 800; padding: 12px 14px; letter-spacing: -.02em; }
.field + .field { margin-top: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* autocomplete dropdown */
.suggest-box {
  background: var(--surface); border: 1px solid var(--line2); border-radius: 12px;
  margin-top: 6px; max-height: 180px; overflow-y: auto; box-shadow: var(--shadow);
}
.suggest-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%;
}
.suggest-item:last-child { border-bottom: none; }
.suggest-item:hover { background: var(--card2); }

/* sheet */
.ovl {
  position: fixed; inset: 0; background: rgba(0, 0, 0, .65);
  backdrop-filter: blur(8px); z-index: 200; display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  background: var(--surface); border: 1px solid var(--line); border-bottom: none;
  border-radius: 24px 24px 0 0; width: 100%; max-width: 600px; max-height: 92vh;
  overflow-y: auto; padding: 0 16px calc(24px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 40px rgba(0,0,0,.3);
}
.sheet-hd {
  position: sticky; top: 0; background: var(--surface); padding: 16px 0 12px;
  display: flex; align-items: center; gap: 10px; z-index: 2; border-bottom: 1px solid var(--line); margin-bottom: 14px;
}
.sheet-hd h3 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.01em; color: var(--text-heading); }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line2); margin: 8px auto 0; }
@media(min-width: 640px) {
  .ovl { align-items: center; }
  .sheet { border-radius: 22px; border-bottom: 1px solid var(--line); max-height: 88vh; }
}

/* nav */
nav.bot {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
  background: var(--surface); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.nav-in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav-in button {
  padding: 10px 0 11px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--dim); font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
}
.nav-in button.on { color: var(--lime); }
.nav-in svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fab {
  position: fixed; right: calc(50% - 300px + 16px); bottom: calc(76px + env(safe-area-inset-bottom));
  z-index: 75; width: 56px; height: 56px; border-radius: 19px;
  background: linear-gradient(135deg, var(--lime), var(--lime-dark)); color: #060a12;
  display: grid; place-items: center; box-shadow: 0 12px 30px rgba(0,0,0,.45);
  transition: transform .15s ease;
}
[data-theme="light"] .fab { color: #ffffff; }
.fab:active { transform: scale(0.92); }
@media(max-width: 632px) { .fab { right: 16px; } }

/* QR Scanner Image & UPI Box */
.upi-card {
  background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
  display: flex; flex-direction: column; gap: 10px; margin-top: 10px;
}
.qr-preview {
  width: 140px; height: 140px; border-radius: 12px; border: 2px dashed var(--line2);
  display: grid; place-items: center; overflow: hidden; margin: 0 auto; background: #ffffff;
}
.qr-preview img { width: 100%; height: 100%; object-fit: contain; }

/* empty + toast */
.empty { text-align: center; padding: 36px 20px; border: 1px dashed var(--line2); border-radius: 20px; }
.empty .em { font-size: 34px; margin-bottom: 8px; }
.empty h3 { margin: 6px 0 4px; font-size: 16px; font-weight: 800; color: var(--text-heading); }
.empty p { margin: 0 0 16px; font-size: 12px; color: var(--muted); line-height: 1.6; }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 300;
  background: var(--surface); color: var(--text-heading); border: 1px solid var(--line2);
  padding: 10px 18px; border-radius: 99px; font-size: 12px; font-weight: 700;
  box-shadow: 0 10px 30px rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
hr.sep { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<input type="file" id="importer" accept="application/json" style="display:none">
<input type="file" id="qr-file-input" accept="image/*" style="display:none">

<script>
(function(){
"use strict";

/* ───────── constants & helpers ───────── */
var STORAGE_KEY = "court-ledger-master-v3";
var $ = function(s){ return document.querySelector(s); };
var PALETTE = ["#10b981","#06b6d4","#3b82f6","#f97316","#8b5cf6","#ec4899","#eab308","#f43f5e","#14b8a6","#6366f1","#84cc16","#d946ef"];

var ROLES = {
  primary_admin: { label: "Primary Admin", desc: "Creator with full access across all features, settings & books", icon: "👑" },
  book_admin:    { label: "Book Admin",    desc: "Can manage members, book settings & add/edit/delete all entries", icon: "⭐" },
  data_operator: { label: "Data Operator", desc: "Can add bookings, log payments & view ledgers. Cannot delete others' logs", icon: "✏️" },
  viewer:        { label: "Viewer",        desc: "Read-only access to view logs, ledgers and balances", icon: "👁️" }
};

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]||c;}); }
function uid(prefix){ return (prefix||"id")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function P(v){ return Math.round((Number(v)||0)*100); } // rupees to paise
function money(p){
  var neg = p<0; p = Math.abs(p);
  var s = "₹"+(p/100).toLocaleString("en-IN",{minimumFractionDigits:(p%100?2:0),maximumFractionDigits:2});
  return (neg?"−":"")+s;
}
function initials(n){ var p=String(n||"?").trim().split(/\s+/); return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase(); }
function pad(n){ return String(n).padStart(2,"0"); }
function nowParts(){
  var d = new Date();
  return {
    date: d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),
    time: pad(d.getHours())+":"+pad(d.getMinutes())
  };
}
function fmtTime(tStr){
  if(!tStr) return "";
  var p = tStr.split(":"); if(p.length<2) return tStr;
  var h = parseInt(p[0],10), m = p[1];
  var ampm = h>=12 ? "PM" : "AM";
  h = h%12; if(h===0) h=12;
  return h+":"+m+" "+ampm;
}
function fmtDT(at, slotText){
  if(!at) return "";
  var d = new Date(at.split("T")[0]);
  var datePart = isNaN(d.getTime()) ? at : d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
  if(slotText) return datePart + " · " + slotText;
  var tPart = at.indexOf("T")>=0 ? at.split("T")[1].slice(0,5) : "";
  return datePart + (tPart ? " · " + fmtTime(tPart) : "");
}
function fmtD(at){
  var d = new Date((at||"").split("T")[0]);
  if(isNaN(d.getTime())) return at||"";
  return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"2-digit"});
}
function toast(msg){
  var t = $("#toast"); if(!t) return;
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 2000);
}

/* ───────── storage ───────── */
var Store = {
  load: function(){
    try {
      var v = localStorage.getItem(STORAGE_KEY);
      if(v) return JSON.parse(v);
    } catch(e){}
    return null;
  },
  save: function(data){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
  }
};

/* ───────── master state ───────── */
var DB = {
  theme: "dark",
  activeBookId: "b_default",
  globalDirectory: [], // [ { name, mobile, upiId, qrImage, color } ]
  books: []
};

var S = {
  view: "home",       // 'home' | 'activities' | 'balances' | 'people' | 'allbooks'
  sheet: null,        // 'activity' | 'payment' | 'person' | 'edit-profile' | 'qrview' | 'type' | 'people' | 'books' | 'create-book' | 'invite' | 'menu' | 'roles-info' | 'notifications'
  draft: null,
  open: {},
  balMode: "pairs",   // 'pairs' | 'everyone' | 'settle'
  qrTargetPersonId: null,
  roleInfoTab: "primary_admin",
  searchQuery: ""
};

/* ───────── model accessors & RBAC ───────── */
function activeBook(){
  var b = DB.books.filter(function(x){ return x.id === DB.activeBookId; })[0];
  if(!b && DB.books.length){ DB.activeBookId = DB.books[0].id; b = DB.books[0]; }
  return b;
}
function saveDB(){ Store.save(DB); }
function applyTheme(th){
  DB.theme = th || "dark";
  document.documentElement.setAttribute("data-theme", DB.theme);
  var metaTheme = document.querySelector('meta[name="theme-color"]');
  if(metaTheme) metaTheme.setAttribute("content", DB.theme==="light"?"#ffffff":"#060a12");
  saveDB();
}

function bPerson(book, id){
  if(!book || !book.people) return null;
  for(var i=0;i<book.people.length;i++) if(book.people[i].id===id) return book.people[i];
  return null;
}
function bPName(book, id){ var p=bPerson(book,id); return p?p.name:"—"; }
function bPColor(book, id){ var p=bPerson(book,id); return p?p.color:"#8899b4"; }
function bPRole(book, id){ var p=bPerson(book,id); return (p&&p.role) ? p.role : "data_operator"; }
function isMeInBook(book, id){ return book && book.meId && book.meId===id; }
function myRole(book){
  if(!book || !book.meId) return "primary_admin";
  var me = bPerson(book, book.meId);
  return me ? (me.role || "primary_admin") : "primary_admin";
}

/* Permission Checks */
function canAddEntries(book){
  var r = myRole(book);
  return r === "primary_admin" || r === "book_admin" || r === "data_operator";
}
function canEditEntry(book, act){
  var r = myRole(book);
  if(r === "primary_admin" || r === "book_admin") return true;
  if(r === "data_operator" && book.meId && act && act.payerId === book.meId) return true;
  return false;
}
function canDeleteEntry(book, act){
  var r = myRole(book);
  if(r === "primary_admin" || r === "book_admin") return true;
  if(r === "data_operator" && book.meId && act && act.payerId === book.meId) return true;
  return false;
}
function canManageBookSettings(book){
  var r = myRole(book);
  return r === "primary_admin" || r === "book_admin";
}
function canDeleteBook(book){
  var r = myRole(book);
  return r === "primary_admin";
}

function bTypeOf(book, id){
  if(!book || !book.types) return {id:id,label:"Activity",emoji:"🏟️"};
  for(var i=0;i<book.types.length;i++) if(book.types[i].id===id) return book.types[i];
  return {id:id,label:"Activity",emoji:"🏟️"};
}

/* Sync to Global Directory */
function syncPersonToDirectory(p){
  if(!p || !p.name) return;
  if(!DB.globalDirectory) DB.globalDirectory = [];
  var existing = DB.globalDirectory.filter(function(x){ return x.name.toLowerCase() === p.name.toLowerCase(); })[0];
  if(existing){
    if(p.mobile) existing.mobile = p.mobile;
    if(p.upiId) existing.upiId = p.upiId;
    if(p.qrImage) existing.qrImage = p.qrImage;
  } else {
    DB.globalDirectory.push({
      name: p.name,
      mobile: p.mobile || "",
      upiId: p.upiId || "",
      qrImage: p.qrImage || "",
      color: p.color || PALETTE[DB.globalDirectory.length % PALETTE.length]
    });
  }
}

/* ───────── calculation engine ───────── */
function calcShares(book, act){
  var ids = (act.parts||[]).filter(function(id){ return !!bPerson(book, id); });
  var out = {}; var n = ids.length; if(!n) return out;
  var total = P(act.amount), base = Math.floor(total/n), rem = total - base*n;
  ids.forEach(function(id){ out[id] = base; });
  if (rem > 0){
    if (out[act.payerId] != null) out[act.payerId] += rem;
    else { var i=0; while(rem-- > 0){ out[ids[i % n]] += 1; i++; } }
  }
  return out;
}

function calcOwedMap(book){
  var m = {};
  function add(a,b,v){ if(a===b||!v) return; if(!m[a]) m[a]={}; m[a][b]=(m[a][b]||0)+v; }
  (book.activities||[]).forEach(function(act){
    var s = calcShares(book, act);
    Object.keys(s).forEach(function(pid){ if(pid!==act.payerId) add(pid, act.payerId, s[pid]); });
  });
  (book.payments||[]).forEach(function(p){
    if(p.status==="confirmed") add(p.fromId, p.toId, -P(p.amount));
  });
  return m;
}

function calcNet(book, a, b){
  var m = calcOwedMap(book);
  return ((m[a]&&m[a][b])||0) - ((m[b]&&m[b][a])||0);
}

function calcBalance(book, pid){
  var t = 0;
  (book.people||[]).forEach(function(o){ if(o.id!==pid) t += calcNet(book, o.id, pid); });
  return t;
}

function calcPairs(book){
  var out = [];
  var ppl = book.people || [];
  for (var i=0; i<ppl.length; i++) {
    for (var j=i+1; j<ppl.length; j++){
      var a = ppl[i].id, b = ppl[j].id;
      var n = calcNet(book, a, b);
      var legAB=0, legBA=0;
      (book.activities||[]).forEach(function(act){
        var s = calcShares(book, act);
        if(act.payerId===b && s[a]) legAB += s[a];
        if(act.payerId===a && s[b]) legBA += s[b];
      });
      var paidAB=0, paidBA=0;
      (book.payments||[]).forEach(function(p){
        if(p.status!=="confirmed") return;
        if(p.fromId===a && p.toId===b) paidAB += P(p.amount);
        if(p.fromId===b && p.toId===a) paidBA += P(p.amount);
      });
      if (legAB || legBA || paidAB || paidBA) {
        out.push({a:a, b:b, net:n, legAB:legAB, legBA:legBA, paidAB:paidAB, paidBA:paidBA});
      }
    }
  }
  return out.sort(function(x,y){ return Math.abs(y.net)-Math.abs(x.net); });
}

function calcSettleUp(book){
  var cred=[], debt=[];
  (book.people||[]).forEach(function(p){
    var b = calcBalance(book, p.id);
    if(b>0) cred.push({id:p.id, v:b});
    else if(b<0) debt.push({id:p.id, v:-b});
  });
  cred.sort(function(a,b){return b.v-a.v;}); debt.sort(function(a,b){return b.v-a.v;});
  var out=[], i=0, j=0;
  while(i<debt.length && j<cred.length){
    var v = Math.min(debt[i].v, cred[j].v);
    if(v>0) out.push({from:debt[i].id, to:cred[j].id, v:v});
    debt[i].v -= v; cred[j].v -= v;
    if(debt[i].v<=0) i++; if(cred[j].v<=0) j++;
  }
  return out;
}

function calcLedgerFor(book, pid){
  var rows = [];
  (book.activities||[]).forEach(function(act){
    var s = calcShares(book, act), t = bTypeOf(book, act.typeId);
    var slotInfo = act.slotText || (act.startTime ? fmtTime(act.startTime)+(act.endTime?"–"+fmtTime(act.endTime):"") : "");
    if(act.payerId===pid){
      var lent = 0; Object.keys(s).forEach(function(k){ if(k!==pid) lent += s[k]; });
      if (lent) rows.push({
        at: act.date||act.at,
        delta: lent,
        ttl: t.emoji + " " + t.label + (act.venue ? " · " + act.venue : ""),
        sub: "You paid " + money(P(act.amount)) + " for " + Object.keys(s).length + " · covered " + money(lent) + " for others" + (slotInfo ? " (" + slotInfo + ")" : "")
      });
    } else if (s[pid]!=null){
      rows.push({
        at: act.date||act.at,
        delta: -s[pid],
        ttl: t.emoji + " " + t.label + (act.venue ? " · " + act.venue : ""),
        sub: "Your share of " + money(P(act.amount)) + " split " + Object.keys(s).length + " ways · booked by " + bPName(book, act.payerId) + (slotInfo ? " (" + slotInfo + ")" : "")
      });
    }
  });
  (book.payments||[]).forEach(function(p){
    if (p.status!=="confirmed") return;
    if (p.fromId===pid) rows.push({at:p.date||p.at, delta:P(p.amount), ttl:"💸 Paid "+bPName(book, p.toId), sub:(p.note||"Settlement")+" ("+(p.paymentMode||"UPI")+")", pay:true});
    if (p.toId===pid)  rows.push({at:p.date||p.at, delta:-P(p.amount), ttl:"✅ Received from "+bPName(book, p.fromId), sub:(p.note||"Settlement")+" ("+(p.paymentMode||"UPI")+")", pay:true});
  });
  rows.sort(function(a,b){ return new Date(a.at)-new Date(b.at); });
  var run = 0; rows.forEach(function(r){ run += r.delta; r.run = run; });
  return rows.reverse();
}

function getPendingNotifications(book){
  if(!book || !book.payments) return [];
  return book.payments.filter(function(p){
    return p.status === "pending" && (!book.meId || p.toId === book.meId);
  });
}

      '<div class="eyebrow">'+esc(book.name)+' · Balance</div>'+
      '<div class="big num" style="color:'+(b>0?"var(--lime)":(b<0?"var(--red)":"var(--text)"))+'">'+money(Math.abs(b))+'</div>'+

        '<div class="mini"><b class="num" style="color:var(--teal)">'+money(owedToMe)+'</b><span>Owed to you</span></div>'+
        '<div class="mini"><b class="num" style="color:var(--red)">'+money(iOwe)+'</b><span>You still owe</span></div>'+

      '<div class="big" style="font-size:22px">Select your player profile</div>'+
      '<div class="note">Pick who you are in this book to manage entries and personal dues.</div>'+
      '<div class="chips" style="margin-top:12px">'+book.people.map(function(p){
        return '<button class="chip" data-a="setme" data-id="'+p.id+'">'+esc(p.name)+' <span class="role-badge '+bPRole(book, p.id)+'" style="font-size:8px">'+(ROLES[bPRole(book, p.id)].label)+'</span></button>';
      }).join("")+'</div></section>';
  }

  // Sent payments awaiting confirmation
  var pout = (book.payments||[]).filter(function(p){ return p.status==="pending" && book.meId && p.fromId===book.meId; });
  if (pout.length){
    h += '<h2 class="sec">Sent, Awaiting Recipient Acknowledgment</h2>';
    h += pout.map(function(p){
      return '<div class="item"><div>'+av(book, p.toId)+'</div><div class="grow"><div class="t">You sent to '+esc(bPName(book, p.toId))+'</div>'+
        '<div class="s">'+fmtDT(p.date||p.at)+' · '+(p.paymentMode||"UPI")+' · Waiting for '+esc(bPName(book, p.toId))+' to acknowledge</div></div>'+
        '<div class="amt num" style="color:var(--gold)">'+money(P(p.amount))+'</div>'+

    }).join("");

  var ps = calcPairs(book).filter(function(p){ return p.net!==0 && (!book.meId || p.a===book.meId || p.b===book.meId); });

  return h;

/* SIGNATURE Net Strip */
function renderNetStrip(book, pr){
  var a = pr.a, b = pr.b;
  var max = Math.max(pr.legAB+pr.paidBA, pr.legBA+pr.paidAB, 1);
  var w = function(v){ return Math.max(4, Math.round(v/max*80)); };
  var debtor = pr.net>0 ? a : b, creditor = pr.net>0 ? b : a, amt = Math.abs(pr.net);
  var creditorPerson = bPerson(book, creditor);

  var h = '<div class="net"><div class="net-head">'+av(book, a,"sm")+av(book, b,"sm")+
    '<div class="grow"><div class="t" style="font-size:12px;font-weight:700">'+esc(nameOrYou(book, a))+' &amp; '+esc(nameOrYou(book, b))+'</div></div>'+
    (amt===0 ? pill("Settled","var(--muted)") : "")+'</div>';

  h += '<div class="net-legs">';
  if (pr.legAB) h += '<div class="leg"><span class="bar b" style="width:'+w(pr.legAB)+'px"></span>'+esc(nameOrYou(book, a))+' → '+esc(nameOrYou(book, b))+' from bookings<span class="lv num">'+money(pr.legAB)+'</span></div>';
  if (pr.legBA) h += '<div class="leg"><span class="bar a" style="width:'+w(pr.legBA)+'px"></span>'+esc(nameOrYou(book, b))+' → '+esc(nameOrYou(book, a))+' from bookings<span class="lv num">'+money(pr.legBA)+'</span></div>';
  if (pr.paidAB) h += '<div class="leg"><span class="bar a" style="width:'+w(pr.paidAB)+'px"></span>'+esc(nameOrYou(book, a))+' already paid<span class="lv num">'+money(pr.paidAB)+'</span></div>';
  if (pr.paidBA) h += '<div class="leg"><span class="bar b" style="width:'+w(pr.paidBA)+'px"></span>'+esc(nameOrYou(book, b))+' already paid<span class="lv num">'+money(pr.paidBA)+'</span></div>';
  h += '</div>';

  if (amt===0){
    h += '<div class="settled">Nets to zero — completely adjusted and settled!</div>';
  } else {
    h += '<div class="net-out">'+av(book, debtor,"sm")+
      '<div class="grow"><div style="font-size:10px;color:var(--dim);text-transform:uppercase;font-weight:700">Net Adjusted Due</div>'+
      '<div class="res num" style="color:var(--lime)">'+esc(nameOrYou(book, debtor))+' owes '+esc(nameOrYou(book, creditor))+' '+money(amt)+'</div></div>'+
      (creditorPerson && creditorPerson.upiId ? '<button class="btn sm ghost" data-a="copy-upi" data-upi="'+esc(creditorPerson.upiId)+'" title="Copy UPI ID">📋 UPI</button>' : '')+
      '<button class="btn sm pri" data-a="pay" data-id="'+debtor+'" data-id2="'+creditor+'">Settle</button></div>';
  }
  return h+'</div>';
}

/* ───────── ACTIVITIES ───────── */
function renderActCard(book, act){
  var t = bTypeOf(book, act.typeId);
  var s = calcShares(book, act), n = Object.keys(s).length, open = !!S.open[act.id];
  var per = n ? Math.floor(P(act.amount)/n) : 0;
  var slotDisplay = act.slotText || (act.startTime ? fmtTime(act.startTime)+(act.endTime?" – "+fmtTime(act.endTime):"") : "");
  var editable = canEditEntry(book, act);
  var deletable = canDeleteEntry(book, act);

  var h = '<div class="act"><button class="act-top" data-a="expand" data-id="'+act.id+'">'+
    '<div class="emo">'+t.emoji+'</div><div class="grow">'+
    '<div class="t trunc">'+esc(t.label)+(act.venue?' <span style="color:var(--dim);font-weight:500">· '+esc(act.venue)+'</span>':'')+'</div>'+
    '<div class="s">'+fmtDT(act.date||act.at, slotDisplay)+' · paid by <b>'+esc(nameOrYou(book, act.payerId))+'</b></div>'+
    '<div class="row" style="margin-top:6px;gap:6px"><div class="avstack">'+Object.keys(s).slice(0,6).map(function(id){return av(book, id,"sm");}).join("")+'</div>'+
    (n>6?'<span class="sub">+'+(n-6)+'</span>':'')+'<span class="sub">'+n+' playing · '+money(per)+' each</span></div>'+
    '</div><div style="text-align:right"><div class="amt num">'+money(P(act.amount))+'</div>'+
    '<div class="s" style="color:var(--lime);font-weight:700">'+(open?"Close":"Details")+'</div></div></button>';

  if (open){
    h += '<div class="act-body">';
    Object.keys(s).forEach(function(id){
      h += '<div class="brk">'+av(book, id,"sm")+'<span class="grow trunc">'+esc(nameOrYou(book, id))+(id===act.payerId?' <span class="sub">· Booked &amp; Paid</span>':'')+'</span>'+
        '<span class="num" style="font-weight:700;color:'+(id===act.payerId?"var(--teal)":"var(--muted)")+'">'+money(s[id])+'</span></div>';
    });
    if (act.note) h += '<div class="sub" style="margin-top:8px;font-style:italic">Note: '+esc(act.note)+'</div>';
    if (editable || deletable){
      h += '<div class="row" style="margin-top:12px;gap:8px">'+
        (editable ? '<button class="btn sm" data-a="editact" data-id="'+act.id+'">Edit</button>' : '')+
        (deletable ? '<button class="btn sm danger" data-a="delact" data-id="'+act.id+'">Delete</button>' : '')+
        '</div>';
    }
    h += '</div>';
  }
  return h+'</div>';
}

function viewActivities(){
  var book = activeBook();
  if(!book || !book.activities || !book.activities.length){
    return '<div class="empty"><div class="em">🗓️</div><h3>No bookings logged yet</h3><p>Log your court slot, venue, cost, and players. The split is calculated automatically.</p>'+
      (canAddEntries(book)?'<button class="btn pri" data-a="newact">+ Log a Court Booking</button>':'<div class="sub">View-only mode</div>')+'</div>';
  }
  var byDay = {}, order = [];
  book.activities.slice().sort(function(a,b){ return new Date((b.date||b.at).split("T")[0])-new Date((a.date||a.at).split("T")[0]); }).forEach(function(a){
    var k = fmtD(a.date||a.at); if(!byDay[k]){ byDay[k]=[]; order.push(k); } byDay[k].push(a);
  });
  var spent = book.activities.reduce(function(s,a){ return s+P(a.amount); },0);
  var h = '<div class="card pad row" style="margin-bottom:14px"><div class="grow"><div class="sub">'+book.activities.length+' entries logged in '+esc(book.name)+'</div>'+
    '<div class="amt num" style="font-size:22px;color:var(--lime)">'+money(spent)+'</div></div>'+
    (canAddEntries(book)?'<button class="btn sm pri" data-a="newact">+ Add Booking</button>':'')+'</div>';

  h += order.map(function(k){
    return '<h2 class="sec">'+esc(k)+'</h2>'+byDay[k].map(function(act){ return renderActCard(book, act); }).join("");
  }).join("");
  return h;
}

/* ───────── BALANCES ───────── */
function viewBalances(){
  var book = activeBook();
  if(!book || !book.people || book.people.length<2){
    return '<div class="empty"><div class="em">⚖️</div><h3>Add at least two players</h3><p>Balances calculate bilateral dues between all participants.</p><button class="btn pri" data-a="people-sheet">Add Players</button></div>';
  }

  var h = '<div class="chips" style="margin-bottom:14px">'+
    ['pairs','everyone','settle'].map(function(m){
      var lbl = m==="pairs" ? "Between Friends" : (m==="everyone" ? "Net per Person" : "Fewest Transfers");
      return '<button class="chip '+(S.balMode===m?"on":"")+'" data-a="balmode" data-id="'+m+'">'+lbl+'</button>';
    }).join("")+'</div>';

  if (S.balMode==="pairs"){
    var ps = calcPairs(book);
    if(!ps.length) return h+'<div class="card pad sub">No expenses logged yet in this book.</div>';
    var live = ps.filter(function(p){ return p.net!==0; }), done = ps.filter(function(p){ return p.net===0; });
    h += live.map(function(pr){ return renderNetStrip(book, pr); }).join("");
    if (done.length) h += '<h2 class="sec">Squared Up / Fully Adjusted</h2>'+done.map(function(pr){ return renderNetStrip(book, pr); }).join("");
    return h;
  }
  if (S.balMode==="everyone"){
    var rows = book.people.map(function(p){ return {p:p, b:calcBalance(book, p.id)}; }).sort(function(a,b){ return b.b-a.b; });
    h += rows.map(function(r){
      var c = r.b>0 ? "var(--lime)" : (r.b<0 ? "var(--red)" : "var(--dim)");
      return '<button class="item" data-a="person" data-id="'+r.p.id+'">'+av(book, r.p.id)+'<div class="grow">'+
        '<div class="t">'+esc(r.p.name)+(isMeInBook(book, r.p.id)?' <span class="sub">· you</span>':'')+' <span class="role-badge '+bPRole(book, r.p.id)+'" style="font-size:8px">'+(ROLES[bPRole(book, r.p.id)].label)+'</span></div>'+
        '<div class="s">'+(r.b>0?"is owed by the group":(r.b<0?"owes the group":"all settled"))+'</div></div>'+
        '<div class="amt num" style="color:'+c+'">'+(r.b>0?"+":"")+money(r.b)+'</div></button>';
    }).join("");
    return h;
  }

  // Fewest transfers
  var su = calcSettleUp(book);
  h += '<div class="card pad sub" style="margin-bottom:10px">The minimum number of payments that settles the entire book simultaneously.</div>';
  if(!su.length) return h+'<div class="card pad sub">Everyone in this book is completely square!</div>';
  h += su.map(function(s){
    var toPerson = bPerson(book, s.to);
    return '<div class="item">'+av(book, s.from,"sm")+'<span style="color:var(--dim)">→</span>'+av(book, s.to,"sm")+
      '<div class="grow"><div class="t">'+esc(nameOrYou(book, s.from))+' pays '+esc(nameOrYou(book, s.to))+'</div>'+
      (toPerson && toPerson.upiId ? '<div class="s">UPI: '+esc(toPerson.upiId)+'</div>' : '')+'</div>'+
      '<div class="amt num" style="color:var(--lime)">'+money(s.v)+'</div>'+
      '<button class="btn sm pri" data-a="pay" data-id="'+s.from+'" data-id2="'+s.to+'">Record</button></div>';
  }).join("");
  return h;
}

        '<div class="grow"><div class="t" style="font-size:12px">'+(isOwed ? esc(pl.otherName)+' owes '+esc(p.name) : esc(p.name)+' owes '+esc(pl.otherName))+'</div></div>'+

  // Account Log
  body += '<h2 class="sec">Transaction History Log</h2>';

  }).join("") : '<div class="card pad sub">No transactions logged yet.</div>';

  return sheetWrap(esc(p.name)+" Profile", body);

function addPersonToBook(book, name, mobile, upiId, role){
  name = String(name||"").trim(); if(!name) return null;
  var exists = (book.people||[]).filter(function(p){ return p.name.toLowerCase()===name.toLowerCase(); })[0];
  if(exists){ toast(name+" is already in this book"); return exists; }
  var isFirst = !book.people || !book.people.length;
  var p = {
    id: uid("p"),
    name: name,
    mobile: mobile || "",
    upiId: upiId || "",
    qrImage: "",
    role: role || (isFirst ? "primary_admin" : "data_operator"),
    color: PALETTE[(book.people?book.people.length:0) % PALETTE.length]
  };
  if(!book.people) book.people = [];
  book.people.push(p);
  if(!book.meId) book.meId = p.id;
  syncPersonToDirectory(p);
  saveDB(); return p;
}

function openActivity(act){
  var book = activeBook(); var np = nowParts();
  S.draft = act ? {
    id: act.id,
    typeId: act.typeId,
    payerId: act.payerId,
    amount: String(act.amount),

    timeMode: act.timeMode || (act.startTime ? 'slot' : 'none'),
    startTime: act.startTime || "20:00",
    endTime: act.endTime || "22:00",
    venue: act.venue || "",
    note: act.note || "",
    parts: act.parts.slice()
  } : {
    id: null,
    typeId: (book.types&&book.types[0]) ? book.types[0].id : "court",
    payerId: (book&&book.meId) || ((book&&book.people[0]) ? book.people[0].id : ""),
    amount: "",
    date: np.date,
    timeMode: "slot",
    startTime: "20:00",
    endTime: "22:00",
    venue: (book.activities && book.activities.length ? book.activities[book.activities.length-1].venue : "") || "",
    note: "",
    parts: (book&&book.meId) ? [book.meId] : ((book&&book.people[0]) ? [book.people[0].id] : [])
  };
  S.sheet = "activity"; render();
}

function openPayment(from, to, amount){
  var book = activeBook(); var np = nowParts();
  var suggested = Math.abs(calcNet(book, from, to));
  S.draft = {
    fromId: from,
    toId: to,
    amount: String(amount || (suggested/100) || ""),
    paymentMode: "UPI",
    date: np.date,
    time: np.time,
    note: "",
    status: (book.meId === to ? "confirmed" : "pending")
  };
  S.sheet = "payment"; render();
}

function formatWhatsAppSummary(book){
  var lines = ["🏸 *" + book.name + " — Balance Summary* (" + fmtD(new Date().toISOString()) + ")"];
  lines.push("━━━━━━━━━━━━━━━━━━━");
  var ps = calcPairs(book).filter(function(p){ return p.net !== 0; });
  if(!ps.length){
    lines.push("🎉 All players are completely square!");
  } else {
    lines.push("*Outstanding Net Settlements:*");
    ps.forEach(function(p){
      var d = p.net>0?p.a:p.b, c = p.net>0?p.b:p.a;
      var creditor = bPerson(book, c);
      var upiStr = creditor && creditor.upiId ? " (UPI: " + creditor.upiId + ")" : "";
      lines.push("• *" + bPName(book, d) + "* pays *" + bPName(book, c) + "*: " + money(Math.abs(p.net)) + upiStr);
    });
  }

  var pend = (book.payments||[]).filter(function(p){ return p.status==="pending"; });
  if(pend.length){
    lines.push("");
    lines.push("*Awaiting Confirmation:*");
    pend.forEach(function(p){
      lines.push("⏳ " + bPName(book, p.fromId) + " marked " + money(P(p.amount)) + " to " + bPName(book, p.toId) + " via " + (p.paymentMode||"UPI"));
    });
  }

  var recent = (book.activities||[]).slice().sort(function(a,b){ return new Date(b.date||b.at)-new Date(a.date||a.at); }).slice(0, 3);
  if(recent.length){
    lines.push("");
    lines.push("*Recent Bookings:*");
    recent.forEach(function(a){
      var slotStr = a.slotText || (a.startTime ? fmtTime(a.startTime)+"–"+fmtTime(a.endTime) : "");
      lines.push("🏟️ " + (a.venue||"Court") + ": " + money(P(a.amount)) + " (" + (slotStr ? slotStr + " · " : "") + bPName(book, a.payerId) + ")");
    });
  }

  lines.push("━━━━━━━━━━━━━━━━━━━");
  lines.push("_Generated via Court Ledger_");
  return lines.join("\n");
}

/* ───────── EVENT DISPATCHER ───────── */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-a]"); if(!el) return;
  var a = el.getAttribute("data-a"), id = el.getAttribute("data-id"), id2 = el.getAttribute("data-id2");
  if (a==="closeovl" && e.target !== el) return;

  var book = activeBook();

  switch(a){
    case "go": S.view = id; S.sheet = null; render(); break;
    case "allbooks-view": S.view = "allbooks"; S.sheet = null; render(); break;
    case "toggle-theme": applyTheme(DB.theme==="light"?"dark":"light"); render(); break;
    case "menu": S.sheet = "menu"; render(); break;
    case "roles-sheet": S.sheet = "roles-info"; render(); break;
    case "role-tab": S.roleInfoTab = id; render(); break;
    case "closesheet": case "closeovl": closeSheet(); break;
    case "expand": S.open[id] = !S.open[id]; render(); break;
    case "balmode": S.balMode = id; render(); break;
    case "setme": if(book){ book.meId = id; saveDB(); S.sheet = null; render(); toast("Switched to: "+bPName(book, id)+" ("+ROLES[bPRole(book, id)].label+")"); } break;
    case "people-sheet": S.sheet = "people"; S.searchQuery = ""; render(); break;
    case "books-sheet": S.sheet = "books"; render(); break;
    case "create-book": S.sheet = "create-book"; render(); break;
    case "switchbook": DB.activeBookId = id; saveDB(); S.sheet = null; S.view = "home"; render(); toast("Switched book"); break;
    case "share-invite": S.sheet = "invite"; render(); break;
    case "demo": loadSampleData(); S.sheet = null; S.view = "home"; render(); break;

    case "copy-upi": {
      var upiVal = el.getAttribute("data-upi");
      if(upiVal && navigator.clipboard){
        navigator.clipboard.writeText(upiVal).then(function(){ toast("UPI ID copied: "+upiVal); });
      } else { prompt("UPI ID:", upiVal); }
      break;
    }
    case "copy-invite-link": {
      var inp = document.getElementById("share-link-input");
      if(inp && navigator.clipboard){
        navigator.clipboard.writeText(inp.value).then(function(){ toast("Invite link copied to clipboard!"); });
      }
      break;
    }
    case "share-book-whatsapp": {
      if(!book) break;
      var text = formatWhatsAppSummary(book);
      var waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(text);
      window.open(waUrl, "_blank");
      break;
    }
    case "show-qr": S.qrTargetPersonId = id; S.sheet = "qrview"; render(); break;

    /* People & Roles */
    case "pick-suggest": {
      var sName = el.getAttribute("data-name");
      var sMob = el.getAttribute("data-mobile");
      var sUpi = el.getAttribute("data-upi");
      addPersonToBook(book, sName, sMob, sUpi, S._newMemberRole || "data_operator");
      closeSheet(); render(); toast(sName+" added from directory!");
      break;
    }
    case "newp-role": {
      S._newMemberRole = id;
      document.querySelectorAll("[data-a='newp-role']").forEach(function(b){ b.classList.remove("on"); });
      el.classList.add("on");
      break;
    }
    case "add-new-member": {
      var inpName = document.getElementById("newp-input");
      var inpMob = document.getElementById("newp-mobile");
      var inpUpi = document.getElementById("newp-upi");
      var nm = inpName ? inpName.value.trim() : "";
      if(!nm){ toast("Please enter member name"); break; }
      addPersonToBook(book, nm, inpMob ? inpMob.value.trim() : "", inpUpi ? inpUpi.value.trim() : "", S._newMemberRole || "data_operator");
      closeSheet(); render(); toast(nm+" added as "+ROLES[S._newMemberRole||"data_operator"].label);
      break;
    }
    case "person": S.draft = { id: id }; S.sheet = "person"; render(); break;
    case "edit-profile": S.draft = { id: id }; S.sheet = "edit-profile"; render(); break;
    case "edit-member-role": S.draft = { id: id }; S.sheet = "edit-profile"; render(); break;
    case "set-member-role": {
      var pT = bPerson(book, S.draft.id);
      if(pT){ pT.role = id; saveDB(); render(); toast("Role updated to "+ROLES[id].label); }
      break;
    }
    case "save-profile": {
      var pTarget = bPerson(book, id);
      if(pTarget){
        var epName = document.getElementById("ep-name");
        var epMobile = document.getElementById("ep-mobile");
        var epUpi = document.getElementById("ep-upi");
        if(epName && epName.value.trim()) pTarget.name = epName.value.trim();
        if(epMobile) pTarget.mobile = epMobile.value.trim();
        if(epUpi) pTarget.upiId = epUpi.value.trim();
        syncPersonToDirectory(pTarget);
        saveDB(); S.sheet = "person"; S.draft = { id: id }; render(); toast("Profile updated");
      }
      break;
    }
    case "upload-qr": S._qrTargetForUpload = S.draft.id; document.getElementById("qr-file-input").click(); break;
    case "remove-qr": {
      var pQr = bPerson(book, S.draft.id);
      if(pQr){ pQr.qrImage = ""; saveDB(); render(); toast("QR Image removed"); }
      break;
    }
    case "delp": {
      if(!canManageBookSettings(book)){ toast("Only Admins can remove members"); break; }
      var used = (book.activities||[]).some(function(x){ return x.payerId===id || x.parts.indexOf(id)>=0; }) ||
                 (book.payments||[]).some(function(x){ return x.fromId===id || x.toId===id; });
      if(used){ toast("Cannot remove — member has existing transactions"); break; }
      book.people = book.people.filter(function(x){ return x.id!==id; });
      if(book.meId===id) book.meId = null;
      saveDB(); closeSheet(); break;
    }

    /* Activities */
    case "newact":
      if(!canAddEntries(book)){ toast("You have Viewer role (Read-only)"); break; }
      if(!book.people || !book.people.length){ S.sheet = "people"; render(); break; }
      openActivity(null); break;
    case "editact": {
      var act = (book.activities||[]).filter(function(x){ return x.id===id; })[0];
      if(act){
        if(!canEditEntry(book, act)){ toast("You can only edit your own entries"); break; }
        openActivity(act);
      }
      break;
    }
    case "delact": {
      var actD = (book.activities||[]).filter(function(x){ return x.id===id; })[0];
      if(actD && !canDeleteEntry(book, actD)){ toast("You can only delete your own entries"); break; }
      if(confirm("Delete this court booking? Balances will recalculate.")){
        book.activities = book.activities.filter(function(x){ return x.id!==id; });
        saveDB(); render(); toast("Booking deleted");
      }
      break;
    }
    case "dtype": syncDraft(); S.draft.typeId = id; render(); break;
    case "dpayer": syncDraft(); S.draft.payerId = id; if(S.draft.parts.indexOf(id)<0) S.draft.parts.push(id); render(); break;
    case "dpart": {
      syncDraft(); var idx = S.draft.parts.indexOf(id);
      if(idx>=0) S.draft.parts.splice(idx, 1); else S.draft.parts.push(id);
      render(); break;
    }
    case "dall": {
      syncDraft();
      S.draft.parts = (S.draft.parts.length === book.people.length) ? [] : book.people.map(function(p){ return p.id; });
      render(); break;
    }
    case "dtime-mode": syncDraft(); S.draft.timeMode = id; render(); break;
    case "set-dur": {
      syncDraft();
      var stVal = S.draft.startTime || "20:00";
      var pT = stVal.split(":"); var hStart = parseInt(pT[0],10), mStart = parseInt(pT[1],10);
      var addMin = id==='1 hr'?60:(id==='1.5 hrs'?90:(id==='2 hrs'?120:180));
      var totalMin = (hStart*60 + mStart + addMin) % 1440;
      var hEnd = Math.floor(totalMin/60), mEnd = totalMin%60;
      S.draft.endTime = pad(hEnd)+":"+pad(mEnd);
      render(); break;
    }
    case "saveact": {
      syncDraft(); var d = S.draft;
      if(!(Number(d.amount)>0)){ toast("Please enter the total court amount"); break; }
      if(!d.payerId){ toast("Who paid for this booking?"); break; }
      if(!d.parts.length){ toast("Select at least one player"); break; }

      var slotText = "";
      if(d.timeMode==='slot' && d.startTime){
        slotText = fmtTime(d.startTime) + (d.endTime ? " – " + fmtTime(d.endTime) : "");
      }

      var rec = {
        id: d.id || uid("act"),
        typeId: d.typeId,
        payerId: d.payerId,
        amount: Number(d.amount),
        date: d.date || nowParts().date,
        timeMode: d.timeMode,
        startTime: d.startTime,
        endTime: d.endTime,
        slotText: slotText,
        venue: (d.venue||"").trim(),
        note: (d.note||"").trim(),
        parts: d.parts.slice()
      };

      if(!book.activities) book.activities = [];
      if(d.id) book.activities = book.activities.map(function(x){ return x.id===d.id ? rec : x; });
      else book.activities.push(rec);

      saveDB(); closeSheet();
      toast(d.id ? "Booking updated" : "Logged — split across "+rec.parts.length+" players!");
      break;
    }

    /* Payments & Two-Party Acknowledgment */
    case "pay": openPayment(id, id2); break;
    case "pmode": syncDraft(); S.draft.paymentMode = id; render(); break;
    case "savepay": {
      syncDraft(); var pd = S.draft;
      if(!(Number(pd.amount)>0)){ toast("Enter the payment amount"); break; }
      if(!book.payments) book.payments = [];
      var isAutoConfirm = (book.meId === pd.toId);
      book.payments.push({
        id: uid("pay"),
        fromId: pd.fromId,
        toId: pd.toId,
        amount: Number(pd.amount),
        paymentMode: pd.paymentMode || "UPI",
        date: pd.date || nowParts().date,
        time: pd.time || nowParts().time,
        note: (pd.note||"").trim(),
        status: isAutoConfirm ? "confirmed" : "pending"
      });
      saveDB(); closeSheet();
      toast(isAutoConfirm ? "Payment cleared immediately" : "Payment marked as paid! Waiting for "+bPName(book, pd.toId)+" to acknowledge.");
      break;
    }
    case "confirmpay": {
      var pay = (book.payments||[]).filter(function(x){ return x.id===id; })[0];
      if(pay){
        pay.status = "confirmed";
        saveDB(); render();
        toast("✅ Payment acknowledged and received! Dues settled.");
      }
      break;
    }
    case "delpay": {
      if(confirm("Cancel / Remove this payment entry?")){
        book.payments = book.payments.filter(function(x){ return x.id!==id; });
        saveDB(); render();
      }
      break;
    }

    /* New Book & Types */
    case "save-new-book": {
      var nbName = document.getElementById("nb-name");
      var nmVal = nbName ? nbName.value.trim() : "";
      if(!nmVal){ toast("Please give your book a name"); break; }
      var myProf = (book && book.meId) ? bPerson(book, book.meId) : null;
      var creatorPerson = {
        id: uid("p"),
        name: myProf ? myProf.name : "You",
        mobile: myProf ? myProf.mobile : "",
        upiId: myProf ? myProf.upiId : "",
        qrImage: myProf ? myProf.qrImage : "",
        role: "primary_admin",
        color: PALETTE[0]
      };
      var newB = {
        id: uid("b"),
        name: nmVal,
        emoji: S._newBookEmoji || "🏸",
        createdAt: new Date().toISOString(),
        meId: creatorPerson.id,
        types: [
          { id: "court", label: "Court booking", emoji: "🏟️" },
          { id: "balls", label: "Balls / Shuttles", emoji: "🟡" }
        ],
        people: [creatorPerson],
        activities: [],
        payments: []
      };
      DB.books.push(newB);
      DB.activeBookId = newB.id;
      syncPersonToDirectory(creatorPerson);
      saveDB(); closeSheet(); S.view = "people"; render();
      toast("Book '"+nmVal+"' created with you as Primary Admin!");
      break;
    }
    case "nb-emoji": {
      S._newBookEmoji = id;
      document.querySelectorAll("[data-a='nb-emoji']").forEach(function(b){ b.classList.remove("on"); });
      el.classList.add("on");
      break;
    }
    case "newtype": syncDraft(); S.draft = { label:"", emoji:"🏟️" }; S.sheet = "type"; render(); break;
    case "temoji": syncDraft(); S.draft.emoji = id; render(); break;
    case "savetype": {
      syncDraft(); var lab = (S.draft.label||"").trim();
      if(!lab){ toast("Enter activity label"); break; }
      if(!book.types) book.types = [];
      book.types.push({ id: uid("t"), label: lab, emoji: S.draft.emoji||"🏟️" });
      saveDB(); S.sheet = null; render(); toast(lab+" added"); break;
    }
    case "deltype": {
      book.types = (book.types||[]).filter(function(t){ return t.id!==id; });
      saveDB(); render(); break;
    }

    /* Reset & Backup */
    case "reset-book": {
      if(!canDeleteBook(book)){ toast("Only Primary Admin can reset the book"); break; }
      if(confirm("Erase all bookings and payments in '"+book.name+"'?")){
        book.activities = []; book.payments = [];
        saveDB(); S.sheet = null; S.view = "home"; render(); toast("Book transactions reset");
      }
      break;
    }
    case "export": {
      var blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob); var link = document.createElement("a");
      link.href = url; link.download = "court-ledger-backup-" + nowParts().date + ".json"; link.click();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      toast("Backup downloaded"); break;
    }
    case "import": document.getElementById("importer").click(); break;
  }
});

document.addEventListener("keydown", function(e){

document.addEventListener("input", function(e){
  var t = e.target;
  if(t && t.id==="f-amount"){ if(S.draft) S.draft.amount = t.value; refreshPreview(); }
  if(t && t.id==="newp-input"){
    S.searchQuery = t.value;
    var book = activeBook();
    var q = t.value.toLowerCase().trim();
    var suggestions = (DB.globalDirectory||[]).filter(function(g){
      var alreadyIn = (book.people||[]).some(function(p){ return p.name.toLowerCase() === g.name.toLowerCase(); });
      if(alreadyIn) return false;
      return !q || g.name.toLowerCase().indexOf(q) >= 0 || (g.mobile && g.mobile.indexOf(q) >= 0);
    });
    var box = document.querySelector(".suggest-box");
    if(!box && suggestions.length){ render(); }
    else if(box){
      box.innerHTML = suggestions.slice(0,5).map(function(sug){
        return '<div class="suggest-item" data-a="pick-suggest" data-name="'+esc(sug.name)+'" data-mobile="'+esc(sug.mobile)+'" data-upi="'+esc(sug.upiId)+'">'+
          '<div class="av sm" style="background:'+sug.color+'">'+esc(initials(sug.name))+'</div>'+
          '<div class="grow"><div style="font-weight:700;font-size:12px">'+esc(sug.name)+'</div>'+
          '<div class="sub">'+(sug.mobile?sug.mobile+" · ":"")+(sug.upiId?'UPI: '+sug.upiId:'')+'</div></div>'+
          '<button class="btn sm pri">+ Add</button></div>';
      }).join("");
    }
  }
});

/* QR Code Image Upload & Compression via Canvas */
document.getElementById("qr-file-input").addEventListener("change", function(e){
  var file = e.target.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(evt){
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement("canvas");
      var maxDim = 400;
      var w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round((h * maxDim)/w); w = maxDim; }
        else { w = Math.round((w * maxDim)/h); h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      var compressedData = canvas.toDataURL("image/jpeg", 0.85);

      var book = activeBook();
      var pTarget = bPerson(book, S._qrTargetForUpload);
      if(pTarget){
        pTarget.qrImage = compressedData;
        syncPersonToDirectory(pTarget);
        saveDB(); render(); toast("QR Scanner image uploaded!");
      }
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = "";
});

/* Import Backup */
document.getElementById("importer").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var j = JSON.parse(r.result);
      if(j.books && Array.isArray(j.books)){
        DB = j;
      }
      saveDB(); applyTheme(DB.theme); S.sheet = null; S.view = "home"; render();
      toast("Backup successfully restored!");
    } catch(err){ toast("Invalid backup file"); }
  };
  r.readAsText(f); e.target.value = "";
});

/* ───────── INITIALIZATION ───────── */
function init(){
  var saved = Store.load();
  if(saved && saved.books && saved.books.length){
    DB = saved;
  } else {
    loadSampleData();
  }

  // Ensure global directory is populated
  if(!DB.globalDirectory) DB.globalDirectory = [];
  DB.books.forEach(function(b){
    (b.people||[]).forEach(syncPersonToDirectory);
  });

  applyTheme(DB.theme || "dark");
  render();
}

init();

})();
